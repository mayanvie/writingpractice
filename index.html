<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Luyện viết tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#5C4038;--muted:#8B6F66;--line:#F3DDD8;--coral:#E07A7A;--coral-ink:#C45C5C;--coral-soft:#FDECEA;--coral-pale:#FFF6F2;--paper:#FFF6F2;--shadow:0 18px 30px -18px rgba(92,64,56,.4);--mH:clamp(150px,34dvh,300px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Nunito","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(170deg,#FDECEA,#FFF6F2 55%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{padding:24px;text-align:center}
.wrap{height:100%}
.scene{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center;background:linear-gradient(170deg,#FDECEA,#FFF6F2 55%)}
.scene::before,.scene::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.scene::before{width:240px;height:240px;top:-80px;right:-70px;background:rgba(244,167,167,.28)}
.scene::after{width:150px;height:150px;top:46%;left:-60px;background:rgba(125,184,146,.16)}
.col{position:relative;z-index:1;width:min(1040px,100%);height:100%;display:flex;flex-direction:column;padding:14px 22px 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.enter .content>*,.enter .bubble{animation:rise .38s ease backwards}
.enter .content>*:nth-child(2){animation-delay:.05s}.enter .content>*:nth-child(3){animation-delay:.1s}.enter .content>*:nth-child(4){animation-delay:.15s}
.char{display:block;height:var(--mH);width:auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(150,80,50,.18))}
@media (prefers-reduced-motion:reduce){.enter .content>*,.enter .bubble,.char,.stash.pop,.stash.pop svg,.stash.pop b,.stash.pop::after{animation:none}}
/* header */
.head{flex:none;display:flex;align-items:center;gap:12px;min-height:48px}
.back{appearance:none;border:0;background:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);box-shadow:0 8px 14px -8px rgba(92,64,56,.4)}
.back:hover{background:#fff}.back svg{width:20px;height:20px}
.htitle{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{flex:none;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800}
.qnums{display:flex;gap:2px}
.qn{appearance:none;border:0;background:none;width:34px;height:34px;border-radius:50%;font-weight:800;color:var(--muted)}
.qn.done{color:var(--coral-ink);background:var(--coral-pale)}
.qn.now{background:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(232,115,90,.35)}
/* stepper */
.stepper{flex:none;display:flex;align-items:center;gap:8px;padding:8px 0 12px}
.stp{appearance:none;border:0;flex:1;justify-content:center;background:#fff;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:23px;font-weight:800;color:var(--ink);box-shadow:0 8px 14px -10px rgba(92,64,56,.4)}
.stp i{width:24px;height:24px;border-radius:50%;border:0;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:#FDECEA;color:#C45C5C}
.stp.done i{background:#EAF6EE;color:#3E7F5B}
.stp.now{background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 10px 16px -8px rgba(196,92,92,.6)}
.stp.now i{background:#fff;color:#C45C5C}
.sep{display:none}
/* main layout */
.main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,32%,360px);gap:28px}
.content{overflow-y:auto;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:clamp(4px,3dvh,28px)}
.char-zone{position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.bubble{position:absolute;left:0;right:0;bottom:calc(var(--mH) + 18px);background:#fff;border:0;border-radius:22px;padding:14px 16px;box-shadow:0 14px 24px -14px rgba(92,64,56,.35);font-weight:800;line-height:1.4;font-size:.98rem;max-height:calc(100% - var(--mH) + 40px);overflow:auto;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:16px;height:16px;background:#fff;border:0;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bubble p{margin:0 0 4px}.bubble p:last-child{margin:0}.bubble .sample{color:var(--coral-ink);font-weight:800}
/* ground + dock */
.ground{position:relative;flex:none;height:auto;display:flex;align-items:center;justify-content:center;padding:8px 0 16px}
.ground::before{display:none}
.dock{position:relative;z-index:1;display:flex;gap:4px;width:min(520px,100%);justify-content:space-around;padding:8px;background:#fff;border-radius:28px;box-shadow:0 14px 24px -16px rgba(92,64,56,.45)}
.dk{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;color:var(--muted)}
.dk svg{width:20px;height:20px}.dk.on{background:#FDECEA;color:#C45C5C}
/* question + frame */
.qline{display:flex;flex-direction:column;gap:2px}
.qline .ask{font-size:clamp(1.7rem,4.4vw,2.8rem);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.qline .vi{color:var(--muted);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.chip-wrap{display:flex;flex-direction:column;gap:2px}
.chip{font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800}
.chip.fixed{padding:0 2px}
.chip.blank{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;color:#C45C5C;border:2px dashed #E07A7A;border-radius:16px;background:#FDECEA}
.chip-vi{color:var(--muted);font-size:.8rem}
.example{margin:0}.ex-en{margin:0;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:22px;background:#EAF6EE;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800;color:var(--ink)}
/* ghép */
.well{width:100%;min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border:2px dashed #E07A7A;border-radius:18px;background:#fff}
.well.good{border-style:solid;border-color:#7DB892;background:#EAF6EE}
.placeholder{color:var(--muted);font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{appearance:none;border:0;background:#fff;border-radius:16px;padding:9px 18px;min-height:46px;font-size:1.15rem;font-weight:800;box-shadow:0 4px 0 #F3D5D0;transition:transform .12s ease}
.word:hover{transform:translateY(-2px)}.well .word{box-shadow:0 4px 0 #F4C9C4}
/* viết */
.writeline{width:100%;display:flex;align-items:center;gap:10px;background:#FFF6F2;border-radius:22px;padding:8px 8px 8px 16px}
.answer-input{flex:1;min-width:0;border:0;background:transparent;border-radius:0;padding:10px 4px;font:inherit;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800;color:var(--ink);outline:none}
.answer-input::placeholder{color:#C7AEA4;font-weight:700}
.answer-input.good,.answer-input:disabled.good{color:#3E7F5B;opacity:1}
.go{appearance:none;border:0;flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 10px 16px -8px rgba(196,92,92,.65)}
.go:hover{transform:none}.go:disabled{background:#F3D5D0;box-shadow:none}.go svg{width:24px;height:24px}
/* buttons */
.btn-row{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.btn{appearance:none;border:0;background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;border-radius:999px;min-height:58px;padding:0 26px;font-weight:800;font-size:1.05rem;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 14px 22px -10px rgba(196,92,92,.65)}
.btn:hover{transform:none}.btn:disabled{background:#F3D5D0;box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#5FA079,#3E7F5B);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 14px 22px -10px rgba(62,127,91,.6)}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:0 8px 16px -12px rgba(92,64,56,.45)}
.linkbtn{appearance:none;border:0;background:none;color:var(--coral-ink);font-weight:800;padding:6px 2px;display:inline-flex;align-items:center;gap:8px}
.linkbtn svg{width:18px;height:18px}
.vwrap{width:100%}
.vtoggle{appearance:none;border:0;background:none;color:#C45C5C;font-weight:800;padding:6px 2px}
.vtoggle::before{content:"✦ "}.vtoggle.open::before{content:"✕ "}.vtoggle.open{background:#FDECEA;border-radius:999px;padding:6px 14px}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vchip{appearance:none;display:flex;flex-direction:column;text-align:left;gap:0;border:0;background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 6px 12px -8px rgba(92,64,56,.4)}
button.vchip:hover{border-color:var(--coral)}.vchip-en{font-weight:800}.vchip-vi{font-size:.78rem;color:var(--muted)}
.hint-box{width:100%}.hint-note{margin:6px 0 0;color:var(--muted);font-size:.85rem}
/* piles */
.pile-row{display:flex;gap:16px;margin-top:4px}
.pile-btn{appearance:none;border:0;background:none;padding:6px 0;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.pile-btn.open{color:var(--coral-ink);border-bottom-color:var(--coral)}
.pile-list{width:100%;max-height:22dvh;overflow:auto}.mini{padding:5px 0;border-bottom:1px solid var(--line)}.pile-empty{color:var(--muted);margin:6px 0}
/* landing */
.landing .col{align-items:center;text-align:center}
.landing .lm{flex:1;min-height:0;width:min(920px,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.landing .hero{width:100%;display:flex;align-items:center;gap:28px}
.landing .bubble{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:1;max-width:none;font-size:clamp(1.35rem,3vw,2rem);padding:22px 26px;max-height:none;overflow:visible;text-align:left}
.landing .bubble::after{left:36px;bottom:-7px}
.landing .char{height:min(280px,40vh);width:auto}
.landing .ground{width:min(560px,100%);min-height:0;flex-direction:column;gap:10px;padding:0 0 8px}
.landing .btn{position:relative;z-index:1;width:100%;min-height:64px;font-size:1.2rem}
.note{position:relative;z-index:1;margin:0;font-size:.9rem;font-weight:700;color:var(--muted)}
.sheet{width:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#FFF6F2}
.sheet .btn{width:100%}
.practice .content{align-self:start;height:auto;max-height:100%;background:#fff;border-radius:34px;padding:22px 20px 18px;box-shadow:0 24px 40px -22px rgba(92,64,56,.35)}
.nobr{white-space:nowrap}
/* topics */
.tgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start;padding:8px 2px 24px}
.tile{appearance:none;border:0;text-align:left;color:var(--ink);border-radius:24px;padding:12px 14px;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 14px 22px -14px rgba(92,64,56,.35)}
.tile:hover{transform:translateY(-2px);box-shadow:0 16px 24px -12px rgba(92,64,56,.4)}
.tile:focus-visible,.qrow:focus-visible{outline:3px solid #E07A7A;outline-offset:3px}
.tone-blush{background:linear-gradient(150deg,#FDECEA,rgba(244,167,167,.7))}
.tone-mint{background:linear-gradient(150deg,#EAF6EE,rgba(125,184,146,.5))}
.ticon{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center}
.ticon svg{width:36px;height:36px;display:block}
.tfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tmeta{font-size:.95rem;font-weight:800;color:var(--ink)}
.ttitle{font-size:1.02rem;font-weight:800;line-height:1.15}
/* lesson list */
.qlist{width:100%;display:flex;flex-direction:column;gap:10px}
.qrow{appearance:none;border:0;background:#fff;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;width:100%;border-radius:22px;box-shadow:0 10px 18px -14px rgba(92,64,56,.4)}
.qrow:hover{background:#fff}
.qmark{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:#FDECEA;color:#C45C5C}
.qrow.done .qmark{background:#EAF6EE;color:#3E7F5B}
.qtext b{display:block;font-size:1.08rem;font-weight:800}.qtext small{color:var(--muted);font-size:.9rem}
.list-title{margin:0;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}.sub{margin:0;color:var(--muted)}
.para{background:#fff;border:0;border-radius:24px;padding:16px 18px;font-size:1.2rem;line-height:1.6;box-shadow:var(--shadow)}
.copy-status{margin:0;color:var(--muted);font-size:.85rem}
.desc{margin:0;color:var(--muted)}
/* phone */
@media (max-width:760px){
  .col{padding:10px 16px 0}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:8px;align-content:start}
  .char{height:108px}
  .bubble{position:relative;bottom:auto;max-height:none;font-size:.92rem;padding:10px 14px}
  .bubble::after{left:auto;right:18px;bottom:-7px}
  .practice .char-zone{order:-1;position:relative;width:auto;display:flex;align-items:flex-end;gap:8px}
  .practice .char{height:96px}
  .practice .bubble{position:relative;right:auto;top:auto;flex:1;width:auto;margin:0 0 4px;font-size:.92rem}
  .landing .hero{align-items:flex-end;gap:10px}
  .landing .char{height:124px}
  .landing .bubble{font-size:1.05rem;padding:14px 16px}
  .landing .bubble::after{left:28px;right:auto}
  .landing .ground{width:100%}
  .list .char-zone{order:-1;position:relative;width:auto;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
  .list .char{height:96px}
  .list .bubble{position:relative;right:auto;flex:1;margin:0 8px 12px 0}
  .ground{padding:8px 0 12px}.dk{padding:8px 12px}
  .stepper{gap:6px}.stp{height:42px;padding:0 8px;font-size:.9rem}
  .tgrid{grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:128px}
  .go{width:48px;height:48px}
  .btn{min-height:54px}
}
@media (max-width:760px) and (max-height:700px){.list .char-zone{display:none}}
.list .content{overflow-y:auto}
.col::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:180px;border-radius:50%;background:rgba(244,167,167,.3);pointer-events:none}
.hub .col,.listx .col,.learnx .col{width:min(1180px,100%);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.hub .col::-webkit-scrollbar,.listx .col::-webkit-scrollbar,.learnx .col::-webkit-scrollbar{width:0;height:0}
.hub .col{width:100%;height:100%;padding:16px 28px 12px;overflow:hidden;display:flex;flex-direction:column}
.hub-app{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;gap:12px}
.hub-bar{flex:none;display:flex;align-items:center;gap:12px;min-height:72px}
.hub-home{appearance:none;border:0;background:#fff;color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 8px 14px -10px rgba(92,64,56,.4)}
.hub-home svg{width:20px;height:20px}
.hub-mascot{height:76px;width:auto;flex:none;display:block;object-fit:contain}
.hub-hello{background:#fff;border-radius:20px;padding:10px 16px;box-shadow:0 10px 18px -14px rgba(92,64,56,.4);min-width:0}
.hub-hello p{margin:0;color:var(--muted);font-size:13px;font-weight:700}
.hub-hello b{display:block;margin-top:2px;font-size:17px;font-weight:800;line-height:1.25}
.hub-spacer{flex:1}
.hub-today{background:#fff;border-radius:18px;padding:10px 14px;width:220px;flex:none;box-shadow:0 10px 18px -14px rgba(92,64,56,.35)}
.hub-today .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.hub-today .row b{color:var(--ink)}
.bar{width:140px;height:14px;border-radius:7px;background:#FDECEA;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(180deg,#F4A7A7,#E07A7A)}
.hub-today .bar{width:100%;height:8px;margin-top:8px;border-radius:99px}
.hub-start{flex:none;min-height:48px;height:48px;padding:0 26px;font-size:1.05rem}
.hub-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto;scrollbar-width:none}
.hub-body::-webkit-scrollbar{width:0;height:0}
.hub-head,.hub .big-head{display:flex;align-items:baseline;gap:12px;margin:0;flex:none}
.hub-head h1,.hub .big-head h2{margin:0;min-width:0;font-size:28px;font-weight:800}
.hub .big-head h2{font-size:20px;white-space:nowrap}
.hub-head span,.hub .big-head span{font-size:13px;color:var(--muted);font-weight:700}
.hub-note{text-align:center;font-size:12px;margin:0;flex:none}
.hub-foot{display:none}
.test-note{margin:0 0 16px;color:var(--muted);font-size:clamp(1.25rem,1.6vw,1.5rem);font-weight:700;line-height:1.45}
.hub-tools{display:flex;align-items:center;gap:10px;flex:none}
.stash{position:relative;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 4px;border-radius:999px;background:#fff;box-shadow:0 8px 14px -10px rgba(92,64,56,.45);flex:none}
.stash svg{width:26px;height:26px;display:block;flex:none}
.stash b{display:inline-block;font-size:1rem;font-weight:800;min-width:1ch;line-height:1}
@keyframes tomato-pop{0%{transform:scale(1);background:#fff}28%{transform:scale(1.48) translateY(-10px);background:#FDECEA;box-shadow:0 18px 26px -8px rgba(196,92,92,.7)}52%{transform:scale(1.05) translateY(2px);background:#fff}74%{transform:scale(1.2)}100%{transform:scale(1);background:#fff}}
@keyframes tomato-wiggle{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-18deg) scale(1.6)}58%{transform:rotate(12deg) scale(1.15)}100%{transform:rotate(0) scale(1)}}
@keyframes tomato-num{0%{transform:scale(1)}30%{transform:scale(1.85);color:#C45C5C}100%{transform:scale(1)}}
@keyframes tomato-plus{0%{opacity:0;transform:translateY(8px) scale(.5)}24%{opacity:1;transform:translateY(-4px) scale(1.25)}100%{opacity:0;transform:translateY(-12px) scale(1)}}
.stash.pop{animation:tomato-pop .85s cubic-bezier(.2,1.3,.4,1);z-index:6}
.stash.pop svg{animation:tomato-wiggle .85s ease}
.stash.pop b{animation:tomato-num .85s ease}
.stash.pop::after{content:"+1";position:absolute;right:calc(100% + 8px);top:4px;color:#C45C5C;font-size:1.25rem;font-weight:800;line-height:1;pointer-events:none;white-space:nowrap;animation:tomato-plus 1s ease forwards}
.rand{appearance:none;border:0;background:none;color:#C45C5C;font-weight:800;font-size:1.05rem;padding:0}
.hub .tgrid{flex:none;min-height:0;overflow:visible;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:auto auto;gap:12px;align-content:start;padding:0}
.hub .tile{position:relative;min-height:0;height:auto;border-radius:20px;padding:14px 16px 12px;gap:0;justify-content:flex-start;background:linear-gradient(160deg,#FDEFEC,#F8D3CF);box-shadow:0 14px 22px -16px rgba(92,64,56,.35)}
.hub .tile.b,.hub .tile.m{background:linear-gradient(160deg,#FDEFEC,#F8D3CF)}
.hub .ti{display:block;height:78px;margin:0 0 8px}
.hub .ti svg{height:78px;width:auto;display:block}
.hub .tile b{font-size:20px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.hub .tile small{display:block;margin-top:3px;font-size:15px;color:var(--muted);line-height:1.25;font-weight:700}

    if (LEX[b1] && hasCat(LEX[b1], "verb")) return true;
  }
  return false;
}

function looksThird(w) {
  if (/^(goes|does|has|is|was)$/.test(w)) return true;
  if (/ies$/.test(w)) {
    var y = w.slice(0, -3) + "y";
    if (LEX[y] && hasCat(LEX[y], "verb")) return true;
  }
  if (/(?:ch|sh|s|x|z)es$/.test(w)) {
    var b = w.slice(0, -2);
    if (LEX[b] && hasCat(LEX[b], "verb")) return true;
  }
  if (/s$/.test(w) && !/ss$/.test(w)) {
    var b2 = w.slice(0, -1);
    if (LEX[b2] && hasCat(LEX[b2], "verb")) return true;
  }
  return false;
}

function checkNoun(part, found, frame) {
  var mode = part.noun;
  if (!mode || mode === "none" || mode === "proper") return "";
  var entry = found.entry;
  var count = countFor(entry, part.slot);
  var bare = found.bare;
  var art = found.art;
  var isBase = bare === entry.w.toLowerCase();
  var isPlural = !!(entry.plural && bare === entry.plural.toLowerCase());
  var fixed = "";
  if (mode === "plural_or_uncount") {
    if (count === "u" || count === "n") {
      if (art === "a" || art === "an") return "**" + entry.w + "** không đếm được, bỏ **a/an**. ✅ " + fillFrame(frame, part, entry.w) + ".";
      if (!isBase && isPlural) return "**" + entry.w + "** không thêm **s**. ✅ " + fillFrame(frame, part, entry.w) + ".";
      return "";
    }
    if (count === "p") {
      if (bare !== (entry.plural || entry.w).toLowerCase()) return "Dùng dạng số nhiều: **" + (entry.plural || entry.w) + "**.";
      return "";
    }
    if (isPlural) return "";
    if (isBase && (art === "a" || art === "an" || art === "the" || art === "my")) {
      if ((art === "a" || art === "an") && entry.art && art !== entry.art) return "Trước **" + entry.w + "** dùng **" + entry.art + "**.";
      return "";
    }
    if (isBase) return "**" + entry.w + "** đếm được, thêm **s**: " + (entry.plural || entry.w + "s") + ". ✅ " + fillFrame(frame, part, entry.plural || entry.w + "s") + ".";
    return "";
  }
  if (mode === "article_or_uncount") {
    if (count === "u" || count === "n") {
      if (art === "a" || art === "an") return "**" + entry.w + "** không đếm được, bỏ **a/an**. ✅ " + fillFrame(frame, part, entry.w) + ".";
      if (!isBase && isPlural) return "**" + entry.w + "** không thêm **s**.";
      return "";
    }
    if (count === "p") {
      if (bare !== (entry.plural || entry.w).toLowerCase()) return "Dùng dạng số nhiều: **" + (entry.plural || entry.w) + "**.";
      return "";
    }
    if (isPlural && !art) return "";
    if (isBase && (art === "a" || art === "an")) {
      if (entry.art && art !== entry.art) return "Trước **" + entry.w + "** dùng **" + entry.art + "**. ✅ " + fillFrame(frame, part, entry.art + " " + entry.w) + ".";
      return "";
    }
    if (isBase && (art === "the" || art === "my")) return "";
    fixed = (entry.art || "a") + " " + entry.w;
    return "Thêm **a** hoặc **an** trước từ này. ✅ " + fillFrame(frame, part, fixed) + ".";
  }
  if (mode === "after_a") {
    if (isPlural && entry.plural && entry.plural.toLowerCase() !== entry.w.toLowerCase()) return "Sau **a** dùng số ít: **" + entry.w + "**.";
    return "";
  }
  return "";
}

function checkSpecial(part, text, question) {
  var slot = part.slot;
  var low = text.toLowerCase();
  if (slot === "number_age") {
    if (!okNumber(text)) return { error: "Viết số như **10** hoặc **ten**." };
    return { ok: true };
  }
  if (slot === "time_clock") {
    if (!okTime(text)) return { error: "Viết giờ như **6 o'clock** hoặc **6:30**." };
    return { ok: true };
  }
  if (slot === "transport") {
    if (low === "on foot") return { ok: true };
    if (/^by an?\b/.test(low)) return { error: "Không thêm **a**. ✅ I go to school by bus." };
    if (/^by [a-z][a-z' -]{1,30}$/.test(low)) {
      var rest = low.replace(/^by /, "");
      if (viChars(rest)) return { error: englishMsg(question, part) };
      var known = LEX[rest] && hasCat(LEX[rest], "transport");
      if (known) return { ok: true };
      if (latinPhrase(rest)) return { ok: true, unsure: true, word: rest };
      return { error: "Dùng **by bus** hoặc **on foot**." };
    }
    return { error: "Dùng **by bus** hoặc **on foot**. ✅ I go to school by bike." };
  }
  if (slot === "prep_place") {
    var pm = /^(in|on|under) (the|my) (.+)$/.exec(low);
    if (!pm) {
      if (/^(in|on|under) [a-z]/.test(low)) return { error: "Thêm **the**: **on the table**." };
      return { error: "Viết vị trí như **on the table** hoặc **under the chair**." };
    }
    if (viChars(pm[3])) return { error: englishMsg(question, part) };
    var obj = findEntry(pm[3]);
    if (obj && !hasCat(obj.entry, "object_room") && !hasCat(obj.entry, "furniture") && !hasCat(obj.entry, "place_go")) return { error: wrongCat(obj.entry, part) };
    if (obj) return { ok: true };
    if (latinPhrase(pm[3])) return { ok: true, unsure: true, word: pm[3] };
    return { error: "Viết vị trí như **on the table**." };
  }
  return null;
}

function checkOneSlot(part, text, question, frame) {
  var min = part.words ? part.words.min : 1;
  var max = part.words ? part.words.max : 3;
  var n = wordCount(text);
  if (n < min || n > max) return { error: countMsg(part) };
  if (isEcho(part, text)) return { error: "Hãy thay bằng **" + echoLabel(part) + "** (ví dụ: " + sampleOf(part) + "), đừng viết lại chữ gợi ý nhé." };
  var special = checkSpecial(part, text, question);
  if (special) return special;
  if ((part.slot === "name" || part.slot === "city_place") && !eachWordCap(text)) {
    return { error: "Tên riêng phải **viết hoa chữ cái đầu**: Lan, không phải lan." };
  }
  if (viChars(text) && !LOANS[text.toLowerCase()]) return { error: englishMsg(question, part) };
  if (part.slot === "hobby_ing" || part.slot === "activity_ing") {
    if (!/\b[a-z]+ing\b/i.test(text)) return { error: "Cần động từ thêm **-ing**, ví dụ: " + sampleOf(part) + "." };
  }
  if (part.slot === "activity_future" || part.slot === "verb_a1") {
    var first = text.split(" ")[0].toLowerCase();
    if (first === "to" || /^to$/.test(text.split(" ")[0].toLowerCase())) return { error: "Dùng động từ nguyên mẫu, không thêm **to**." };
    if (/ing$/.test(first) && first.length > 4) return { error: "Dùng động từ nguyên mẫu, không dùng **-ing**." };
    if (looksPast(first)) return { error: "Dùng động từ nguyên mẫu, không dùng quá khứ." };
    if (looksThird(first)) return { error: "Dùng động từ nguyên mẫu, không thêm **s**." };
  }
  var found = findEntry(text);
  if (!found && /^(a|an|the|my)\s+/.test(text.toLowerCase())) found = findEntry(text.replace(/^(a|an|the|my)\s+/i, ""));
  if (found && !hasCat(found.entry, part.slot)) return { error: wrongCat(found.entry, part) };
  if (found) {
    var nounErr = checkNoun(part, found, frame);
    if (nounErr) return { error: nounErr };
    return { ok: true };
  }
  if (phraseOk(part, text)) return { ok: true };
  if (latinPhrase(text)) return { ok: true, unsure: true, word: text };
  return { error: "Từ này chưa rõ. Hãy nhìn ví dụ: **" + sampleOf(part) + "**." };
}

function checkSlots(slots, question, frame) {
  var unsure = false;
  var words = [];
  var i;
  for (i = 0; i < slots.length; i++) {
    var one = checkOneSlot(slots[i].part, slots[i].text, question, frame);
    if (one.error) return { error: one.error, unsure: false, newWords: [] };
    if (one.unsure) { unsure = true; if (one.word) words.push(one.word); }
  }
  return { error: "", unsure: unsure, newWords: words };
}

function altsOf(part) {
  var options = [part.t];
  var a = part.alts || [];
  var i;
  for (i = 0; i < a.length; i++) if (a[i]) options.push(a[i]);
  options.sort(function (x, y) { return y.length - x.length; });
  return options;
}

function matchAt(body, pos, frame, fi, acc) {
  if (fi >= frame.length) {
    if (pos < body.length && body.charAt(pos) === " ") pos++;
    if (pos !== body.length) return null;
    return acc;
  }
  if (pos < body.length && body.charAt(pos) === " ") pos++;
  var part = frame[fi];
  if (part.t) {
    var options = altsOf(part);
    var j;
    for (j = 0; j < options.length; j++) {
      var opt = options[j];
      if (pos + opt.length > body.length) continue;
      if (body.substr(pos, opt.length).toLowerCase() !== opt.toLowerCase()) continue;
      var next = pos + opt.length;
      if (next < body.length && body.charAt(next) !== " ") continue;
      var hit = matchAt(body, next, frame, fi + 1, acc);
      if (hit) return hit;
    }
    return null;
  }
  if (fi === frame.length - 1) {
    return matchAt(body, body.length, frame, fi + 1, acc.concat([{ part: part, text: body.substring(pos).trim() }]));
  }
  var k = pos;
  while (k <= body.length) {
    if (k === body.length || body.charAt(k) === " ") {
      var hit2 = matchAt(body, k, frame, fi + 1, acc.concat([{ part: part, text: body.substring(pos, k).trim() }]));
      if (hit2) return hit2;
    }
    if (k === body.length) break;
    k++;
  }
  return null;
}

function matchFrame(body, frame) {
  if (!frame || !frame.length) return null;
  return matchAt(body, 0, frame, 0, []);
}

function basicFail(s) {
  if (!s) return "Hãy viết câu trả lời của bạn trước nhé.";
  if (/___|\[[^\]]*\]|\.\.\./.test(s)) return "Hãy thay phần **[ ]** bằng từ của bạn nhé.";
  if (!re("^[" + UPPER + "]").test(s)) return "Chữ cái đầu câu phải **viết hoa**.";
  if (!/[.!?]$/.test(s)) return "Cuối câu cần có **dấu chấm (.)**.";
  return "";
}

function splitSentences(s) {
  var out = [];
  var cur = "";
  var i;
  for (i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    cur += ch;
    if (ch === "." || ch === "!" || ch === "?") {
      var t = cur.trim();
      if (t) out.push(t);
      cur = "";
    }
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

function yesNeed(aux) {
  if (aux === "do") return "Yes, I do.";
  if (aux === "can") return "Yes, I can.";
  return "Yes, I am.";
}

function noNeed(aux) {
  if (aux === "do") return "No, I don't.";
  if (aux === "can") return "No, I can't.";
  return "No, I am not.";
}

function yesNoTable(body, q) {
  var aux = q.aux;
  if (/^(Yes|No),\s*(yes|no)\b/i.test(body)) return "Chọn **Yes** hoặc **No** thôi nhé.";
  if (/^(Yes|No) [A-Za-z]/.test(body) && body.indexOf(",") < 0) return "Sau **Yes/No** cần có **dấu phẩy**: " + yesNeed(aux).replace(/\.$/, "") + ".";
  if (/^Yes,\s+I'm$/i.test(body)) return "Câu trả lời ngắn khẳng định **không viết tắt**: Yes, I am.";
  if (viChars(body) && !LOANS[body.toLowerCase()]) return "Hãy viết bằng **tiếng Anh** nhé.";
  if (/\bI am no\b/i.test(body)) return "Dùng **not**. ✅ I am not a student.";
  if (/\bI amn't\b/i.test(body) || /\bI aren't\b/i.test(body)) return "'I' đi với **am not** (hoặc **I'm not**).";
  if (/\bI can not\b/i.test(body)) return "Viết liền: **cannot** hoặc **can't**.";
  if (/\bI don't can\b/i.test(body) || /\bI no can\b/i.test(body)) return "Với **can**, dùng **can't** hoặc **cannot**. ✅ I can't swim.";
  if (/\bI doesn't\b/i.test(body) || /\bI not live\b/i.test(body)) return "'I' dùng **don't**. ✅ No, I don't.";
  if (aux === "am" && (/^Yes,\s+I\s+(do|can)\b/i.test(body) || /^No,\s+I\s+(do not|don't|do|can't|cannot)\b/i.test(body))) return "Câu hỏi dùng **am**, nên trả lời **Yes, I am.**";
  if (aux === "do" && (/^Yes,\s+I\s+(am|can)\b/i.test(body) || /^No,\s+I\s+(am|can't|cannot)\b/i.test(body))) return "Câu hỏi dùng **do**, nên trả lời **Yes, I do.**";
  if (aux === "can" && (/^Yes,\s+I\s+(am|do)\b/i.test(body) || /^No,\s+I\s+(am|do not|don't|do)\b/i.test(body))) return "Câu hỏi dùng **can**, nên trả lời **Yes, I can.**";
  if (aux === "can") {
    if (/^(?:Yes,\s+|No,\s+)?I can to\b/i.test(body)) return "Sau **can** là động từ nguyên mẫu, không có **to**, **-ing** hay **s**. ✅ I can swim.";
    if (/^(?:Yes,\s+|No,\s+)?I can [a-z]+ing\b/i.test(body)) return "Sau **can** là động từ nguyên mẫu, không có **to**, **-ing** hay **s**. ✅ I can swim.";
    var verb = "";
    var mv = /^(?:Yes,\s+|No,\s+)?I can ([a-z]+)\b/i.exec(body);
    if (mv && looksThird(mv[1].toLowerCase())) return "Sau **can** là động từ nguyên mẫu, không có **to**, **-ing** hay **s**. ✅ I can swim.";
  }
  if (/^Yes\b/i.test(body) && /(\bnot\b|n't\b|\bcannot\b)/i.test(body)) return "Yes thì câu phía sau **không có not**. ✅ " + yesNeed(aux);
  if (/^No,\s+I\s+(am|do|can)$/i.test(body)) return "No thì cần **not**. ✅ " + noNeed(aux);
  if (aux === "am" && /^(?:No,\s+)?I not\b/i.test(body)) return "Thiếu **am**. ✅ No, I am not.";
  return "";
}

function matchL2(body, aux) {
  if (aux === "am") {
    if (/^Yes, I am$/i.test(body)) return "yes";
    if (/^No, I am not$/i.test(body) || /^No, I'm not$/i.test(body)) return "no";
  }
  if (aux === "do") {
    if (/^Yes, I do$/i.test(body)) return "yes";
    if (/^No, I don't$/i.test(body) || /^No, I do not$/i.test(body)) return "no";
  }
  if (aux === "can") {
    if (/^Yes, I can$/i.test(body)) return "yes";
    if (/^No, I can't$/i.test(body) || /^No, I cannot$/i.test(body)) return "no";
  }
  return "";
}

function matchL3(body, q) {
  var pol = "";
  var rest = body;
  var m = /^(Yes|No),\s+(.*)$/i.exec(body);
  if (m) { pol = m[1].toLowerCase(); rest = m[2]; }
  var work = rest;
  if (q.tails && q.tails.length) work = work.replace(/\s+(very well|a little|well)$/i, "");
  var negFirst = /(\bnot\b|n't\b|\bcannot\b)/i.test(work);
  var list = [];
  var i;
  var affirm = q.core && q.core.affirm ? q.core.affirm : [];
  var negate = q.core && q.core.negate ? q.core.negate : [];
  if (negFirst) {
    for (i = 0; i < negate.length; i++) list.push({ frame: negate[i], neg: true });
    for (i = 0; i < affirm.length; i++) list.push({ frame: affirm[i], neg: false });
  } else {
    for (i = 0; i < affirm.length; i++) list.push({ frame: affirm[i], neg: false });
    for (i = 0; i < negate.length; i++) list.push({ frame: negate[i], neg: true });
  }
  for (i = 0; i < list.length; i++) {
    var slots = matchFrame(work, list[i].frame);
    if (!slots) continue;
    if (pol === "yes" && list[i].neg) return { error: "Yes thì câu phía sau **không có not**. ✅ " + yesNeed(q.aux) };
    if (pol === "no" && !list[i].neg) return { error: "No thì cần **not**. ✅ " + noNeed(q.aux) };
    var slotRes = checkSlots(slots, q, list[i].frame);
    if (slotRes.error) return { error: slotRes.error };
    return { ok: true, pol: list[i].neg ? "no" : "yes", unsure: slotRes.unsure, newWords: slotRes.newWords };
  }
  return null;
}

function nudgeFor(level, pol, q) {
  if (level === 1) {
    if (pol === "no") return "Thử viết cả câu: **" + noNeed(q.aux) + "**";
    return "Thử viết cả câu: **" + yesNeed(q.aux) + "**";
  }
  if (level === 2) {
    var sample = q.example || "";
    if (pol === "no" && q.negExample) sample = q.negExample;
    sample = sample.replace(/[.!?]$/, "");
    var lead = pol === "no" ? "No, " : "Yes, ";
    if (/^(yes|no),/i.test(sample)) lead = "";
    return "Thêm cả câu cho đầy đủ: **" + lead + sample + ".**";
  }
  return "";
}

function framesOf(q) {
  var list = [];
  var i;
  if (q.frame) list.push(q.frame);
  if (q.altFrames) for (i = 0; i < q.altFrames.length; i++) list.push(q.altFrames[i]);
  if (q.core) {
    if (q.core.affirm) for (i = 0; i < q.core.affirm.length; i++) list.push(q.core.affirm[i]);
    if (q.core.negate) for (i = 0; i < q.core.negate.length; i++) list.push(q.core.negate[i]);
  }
  return list;
}

function prepFollow(body) {
  var s = body.replace(/^(?:But|And)\s+/i, "");
  s = s.replace(/^(?:Yes|No),\s+/i, "");
  s = s.replace(/\s+(?:very well|a little|well)$/i, "");
  return s;
}

function matchAnyLesson(body) {
  var slotError = "";
  var li;
  var qi;
  var fi;
  for (li = 0; li < LESSONS.length; li++) {
    var qs = LESSONS[li].questions;
    for (qi = 0; qi < qs.length; qi++) {
      var frames = framesOf(qs[qi]);
      for (fi = 0; fi < frames.length; fi++) {
        var slots = matchFrame(body, frames[fi]);
        if (!slots) continue;
        var res = checkSlots(slots, qs[qi], frames[fi]);
        if (!res.error) return { ok: true, unsure: res.unsure, newWords: res.newWords };
        if (!slotError) slotError = res.error;
      }
    }
  }
  if (slotError) return { ok: false, error: slotError };
  return { ok: false, error: "" };
}

function checkFollowUps(parts) {
  var i;
  var unsure = false;
  var words = [];
  if (parts.length > 2) return { bad: true, message: "Câu chính đúng rồi! Chỉ thêm tối đa 2 câu thôi nhé." };
  for (i = 0; i < parts.length; i++) {
    var sent = parts[i];
    var body = sent.replace(/[.!?]$/, "");
    if (wordCount(body) > 12) return { bad: true, message: "Câu chính đúng rồi! Câu thêm hơi dài. Thử câu ngắn như **I am a teacher.**" };
    var shared = firstError(SHARED_ERRORS, sent);
    if (shared) return { bad: true, message: "Câu chính đúng rồi! Câu thêm bị lỗi: " + shared + "." };
    var cleaned = prepFollow(body);
    var hit = matchAnyLesson(cleaned);
    if (hit.ok) {
      if (hit.unsure) { unsure = true; words = words.concat(hit.newWords || []); }
      continue;
    }
    if (hit.error) return { bad: true, message: "Câu chính đúng rồi! Câu thêm bị lỗi: " + hit.error };
    if (/^(I|My|We|He|She|It|They|The|There)\b/.test(cleaned) && latinPhrase(cleaned) && !viChars(cleaned)) {
      unsure = true;
      words.push(cleaned);
      continue;
    }
    return { bad: true, message: "Câu thêm chưa rõ. Thử câu ngắn như **I am a teacher.**" };
  }
  return { bad: false, unsure: unsure, newWords: words };
}

function pack(status, message, sentence, extra) {
  var out = { status: status, message: message || "", sentence: sentence, nudge: "", level: 0, newWords: [] };
  if (extra) {
    if (extra.nudge) out.nudge = extra.nudge;
    if (extra.level) out.level = extra.level;
    if (extra.newWords) out.newWords = extra.newWords;
  }
  if (out.newWords && out.newWords.length) logUnsure(out.newWords);
  return out;
}

function checkYesNo(s, q) {
  var parts = splitSentences(s);
  var i;
  for (i = 0; i < parts.length; i++) {
    if (!re("^[" + UPPER + "]").test(parts[i])) return pack("error", "Chữ cái đầu câu phải **viết hoa**.", s);
    if (!/[.!?]$/.test(parts[i])) return pack("error", "Cuối câu cần có **dấu chấm (.)**.", s);
  }
  var main = parts[0];
  var mainBody = main.replace(/[.!?]$/, "");
  var table = yesNoTable(mainBody, q);
  if (table) return pack("error", table, s);
  var qerr = firstError(q.errors, main);
  if (qerr) return pack("error", qerr, s);
  var level = 0;
  var pol = "";
  var newWords = [];
  var unsure = false;
  if (/^Yes$/i.test(mainBody) || /^No$/i.test(mainBody)) {
    level = 1;
    pol = /^Yes$/i.test(mainBody) ? "yes" : "no";
  }
  if (!level) {
    var l2 = matchL2(mainBody, q.aux);
    if (l2) { level = 2; pol = l2; }
  }
  if (!level) {
    var l3 = matchL3(mainBody, q);
    if (l3 && l3.error) return pack("error", l3.error, s);
    if (l3 && l3.ok) {
      level = 3;
      pol = l3.pol;
      unsure = !!l3.unsure;
      newWords = l3.newWords || [];
    }
  }
  if (!level) {
    if (parts.length === 1) {
      var also = firstError(q.alsoOk, s) || firstError(YESNO_ALSO, s);
      if (also) return pack("alsoOk", also, s);
    }
    if (viChars(s)) return pack("error", englishMsg(q, null), s);
    return pack("error", MSG_FRAME, s);
  }
  var nudge = nudgeFor(level, pol, q);
  if (parts.length === 1) return pack(unsure ? "unsureOk" : "ok", "", s, { level: level, nudge: nudge, newWords: newWords });
  var fu = checkFollowUps(parts.slice(1));
  if (fu.bad) return pack("ok", "", s, { level: level, nudge: fu.message, newWords: newWords });
  var allNew = newWords.concat(fu.newWords || []);
  return pack(unsure || fu.unsure ? "unsureOk" : "ok", "", s, { level: 4, nudge: "Mở rộng rất tốt! 🌟", newWords: allNew });
}

function grade(raw, question) {
  var s = normalize(raw);
  var basic = basicFail(s);
  if (basic) return pack("error", basic, s);
  if (question.type === "yesno") return checkYesNo(s, question);
  var err = firstError(question.errors, s);
  if (err) return pack("error", err, s);
  var body = s.replace(/[.!?]$/, "");
  var slots = matchFrame(body, question.frame);
  if (!slots) {
    var also = firstError(question.alsoOk, s);
    if (also) return pack("alsoOk", also, s);
    if (viChars(s)) return pack("error", englishMsg(question, null), s);
    return pack("error", MSG_FRAME, s);
  }
  var slotRes = checkSlots(slots, question, question.frame);
  if (slotRes.error) return pack("error", slotRes.error, s);
  if (slotRes.unsure) return pack("unsureOk", "", s, { newWords: slotRes.newWords });
  return pack("ok", "", s);
}

function checkAnswer(raw, question) {
  var r = grade(raw, question);
  if (r.status === "ok" || r.status === "unsureOk") {
    return { ok: true, sentence: r.sentence, message: r.message || "", nudge: r.nudge || "", level: r.level || 0, status: r.status };
  }
  if (r.status === "alsoOk") return { ok: false, alsoOk: true, message: r.message, sentence: r.sentence, status: "alsoOk" };
  return { ok: false, message: r.message, status: "error" };
}

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);

    var data = JSON.parse(raw);
    var p = defaultProgress();
    if (data && typeof data.sentences === "number" && isFinite(data.sentences) && data.sentences >= 0) {
      p.sentences = Math.floor(data.sentences);
    }
    if (data && data.finished && typeof data.finished === "object") p.finished = data.finished;
    if (data && data.mastered && typeof data.mastered === "object") p.mastered = data.mastered;
    if (data && data.learned && typeof data.learned === "object") p.learned = data.learned;
    return p;
  } catch (err) {

}

    var old = Array.isArray(arr) ? arr : [];
    arr = [];
    for (var i = 0; i < n; i++) arr.push(!!old[i]);

  }
  return arr;
}

function renderHub() {
  var done = 0;
  var i;
  for (i = 0; i < LESSONS.length; i++) if (allLearned(LESSONS[i])) done++;
  var pct = Math.round(done / LESSONS.length * 100);
  var html = '<div class="scene hub"><div class="col"><div class="hub-app"><header class="hub-bar">';
  html += '<button type="button" class="hub-home" data-action="welcome" aria-label="Trang chủ">' + ICON_HOME + "</button>";
  html += '<img class="hub-mascot" src="char.png" alt="">';
  html += '<div class="hub-hello"><p>Xin chào, tớ là <span class="nobr">O-ma-oo</span>.</p><b>Tớ sẽ hướng dẫn cho cậu tập viết câu.</b></div>';
  html += '<div class="hub-spacer"></div>';
  html += '<div class="hub-today"><div class="row"><span>Hôm nay</span><b>' + done + " / " + LESSONS.length + ' bài</b></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  html += tomatoHtml();
  html += '<button type="button" class="btn hub-start" data-action="continue">Bắt đầu</button></header>';
  html += '<div class="hub-body"><div class="hub-head"><h1>Chọn chủ đề</h1><span>10 chủ đề · 5 câu mỗi chủ đề</span></div><div class="tgrid">';
  for (i = 0; i < LESSONS.length; i++) {
    var lesson = LESSONS[i];
    var finished = allLearned(lesson);
    html += '<button type="button" class="tile b" data-action="learn" data-lesson="' + lesson.id + '">';
    html += '<span class="ti">' + TOPIC_ART[lesson.id] + "</span>";
    if (finished) html += '<span class="tcheck" aria-hidden="true">' + ICON_CHECK + "</span>";
    html += "<b>" + esc(lesson.title) + "</b><small>" + esc(TOPIC_SHORT[lesson.id]) + "</small></button>";
  }
  html += '</div><section class="hub-big"><div class="big-head"><h2>Bài kiểm tra to</h2><span>10 câu trộn từ 10 chủ đề · xong một bài nhận 10 quả cà chua</span></div><div class="big-row">';
  for (i = 1; i <= 5; i++) {
    var got = bigDone(i);
    html += '<button type="button" class="big-btn' + (got === 10 ? " done" : "") + '" data-action="big-test" data-big="' + i + '"><b>Bài ' + i + "</b><small>" + (got ? got + "/10 câu đã thuộc" : "10 câu mới") + "</small></button>";
  }
  html += '</div></section><p class="note hub-note">Bài tập đệm, nên học cùng thầy cô hoặc phụ huynh.</p></div>';
  html += '<div class="hub-foot"><button type="button" class="btn" data-action="continue">Bắt đầu</button></div></div></div></div>';
  return html;
}

function renderHome() {
  var done = 0;
  var i;
  for (i = 0; i < LESSONS.length; i++) if (allLearned(LESSONS[i])) done++;
  var html = '<div class="home-land">';
  html += '<nav><div class="w"><a class="logo" href="#top"><img src="char.png" alt="">Luyện viết tiếng Anh</a>';
  html += '<div class="nl"><a href="#cach">Cách học</a><a href="#chu-de">Chủ đề</a><a href="#kiem-tra">Kiểm tra</a></div>';
  html += tomatoHtml() + '<button type="button" class="btn s" data-action="topics">Bắt đầu</button></div></nav>';
  html += '<header class="hero" id="top"><div class="w"><div><span class="tag">✦ 10 chủ đề · 5 câu mỗi chủ đề</span>';
  html += '<h1>Tập viết câu tiếng Anh, <span>từng bước nhỏ</span></h1>';
  html += '<p class="lead">Tớ là O-ma-oo. Mỗi câu đi qua ba bước xem – ghép – viết, rồi cậu thử sức với bài kiểm tra nhỏ và bài kiểm tra to nhé.</p>';
  html += '<div class="cta"><button type="button" class="btn" data-action="topics">Bắt đầu học</button><a class="btn g" href="#cach">Xem cách học</a></div>';
  html += '<p class="note">Bài tập đệm, nên học cùng thầy cô hoặc phụ huynh.</p></div>';
  html += '<div class="stage"><div class="bubble">Xin chào, tớ là O-ma-oo.<small>Tớ sẽ hướng dẫn cho cậu tập viết câu.</small></div>';
  html += '<img class="mascot-img" src="char.png" alt="Mascot O-ma-oo"></div></div></header><main class="w">';
  html += '<section id="cach"><h2>Mỗi câu chỉ cần ba bước</h2><p class="sub">Đi chậm một chút, nhớ lâu hơn một chút.</p><div class="steps">';

function fisher(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function shuffledTokens(sentence) {
  var words = sentence.split(" ");
  var tokens = [];
  for (var i = 0; i < words.length; i++) tokens.push({ id: String(i), text: words[i] });
  var original = words.join(" ");
  var order = tokens.slice();
  for (var n = 0; n < 20; n++) {
    order = fisher(tokens);
    var joined = [];
    for (var k = 0; k < order.length; k++) joined.push(order[k].text);
    if (joined.join(" ") !== original) return order;
  }
  return tokens.slice().reverse();
}

function pickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  var i;
  for (i = 0; i < state.bank.length; i++) if (state.bank[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.bank.splice(idx, 1)[0];
  state.picked.push(tok);
  if (!state.bank.length) {
    var built = [];
    for (i = 0; i < state.picked.length; i++) built.push(state.picked[i].text);
    state.ghepChecked = true;
    state.ghepOk = built.join(" ") === currentQuestion().example;
  } else {
    state.ghepChecked = false;
    state.ghepOk = false;
  }
  render();
}

function unpickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  for (var i = 0; i < state.picked.length; i++) if (state.picked[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.picked.splice(idx, 1)[0];
  state.bank.push(tok);
  state.ghepChecked = false;
  state.ghepOk = false;
  render();
}

function rememberSentence() {
  if (state.counted) return;
  progress.sentences += 1;
  state.counted = true;
  state.tomatoPop = true;
  saveProgress();
}

function checkWrite() {
  if (state.writeOk) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var result = checkAnswer(raw, currentQuestion());
  if (result.alsoOk) {
    state.writeMsg = result.message;
    state.writeAlso = true;
    state.writeOk = false;
    state.nudge = "";
    render();
    return;
  }
  if (!result.ok) {
    state.writeMsg = result.message;
    state.writeOk = false;
    state.writeAlso = false;
    state.nudge = "";
    render();
    return;
  }
  rememberSentence();
  if (!state.single) {
    var lid = String(currentLesson().id);
    if (!progress.learned[lid]) progress.learned[lid] = [];
    progress.learned[lid][state.qIndex] = result.sentence;
    state.answers[state.qIndex] = result.sentence;
    if (allLearned(currentLesson())) progress.finished[lid] = true;
    saveProgress();
  }
  state.draft = result.sentence;
  state.writeMsg = "";
  state.writeAlso = false;
  state.nudge = result.nudge || "";
  state.writeOk = true;
  render();
}

function nextQuestion() {
  if (state.single) {
    returnToTest();
    return;
  }
  var lesson = currentLesson();
  if (state.qIndex >= lesson.questions.length - 1) {
    if (allLearned(lesson)) {
      progress.finished[String(lesson.id)] = true;
      saveProgress();
    }
    state.view = "lesson";
    render();
    return;
  }
  state.qIndex += 1;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.writeAlso = false;
  state.nudge = "";
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function mixRand(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a * 1664525 + 1013904223) >>> 0;
    return a / 4294967296;
  };
}

function seededShuffle(list, seed) {
  var a = list.slice();
  var rnd = mixRand(seed);
  var i;
  var j;
  var tmp;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(rnd() * (i + 1));
    tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function bigDeck(n) {
  var items = [];
  var i;
  for (i = 0; i < LESSONS.length; i++) items.push({ lessonId: LESSONS[i].id, qIndex: n - 1 });
  return seededShuffle(items, 4100 + n * 97);
}

function bigDone(n) {
  var deck = bigDeck(n);
  var done = 0;
  var i;
  for (i = 0; i < deck.length; i++) {
    if (masteredFlags(lessonById(deck[i].lessonId))[deck[i].qIndex]) done++;
  }
  return done;
}

function sameCard(a, b) {
  if (a && typeof a === "object") return !!b && a.lessonId === b.lessonId && a.qIndex === b.qIndex;
  return a === b;
}

function pilesDeck(deck) {
  var ok = "";
  var wait = "";
  var okN = 0;
  var waitN = 0;
  var i;
  for (i = 0; i < deck.length; i++) {
    var lesson = lessonById(deck[i].lessonId);
    var q = lesson.questions[deck[i].qIndex];
    var label = '<div class="mini"><strong>' + esc(lesson.title) + ".</strong> " + esc(q.ask) + "</div>";
    if (masteredFlags(lesson)[deck[i].qIndex]) { ok += label; okN++; }
    else { wait += label; waitN++; }
  }
  if (!okN) ok = '<p class="pile-empty">Chưa có câu nào.</p>';
  if (!waitN) wait = '<p class="pile-empty">Không còn câu nào.</p>';
  var okOpen = !!state.pileOk;
  var waitOpen = !!state.pileWait;
  var html = '<div class="pile-row">';
  html += '<button type="button" class="pile-btn ok' + (okOpen ? " open" : "") + '" data-action="toggle-pile" data-pile="ok" aria-expanded="' + (okOpen ? "true" : "false") + '">Đã thuộc · ' + okN + "</button>";
  html += '<button type="button" class="pile-btn wait' + (waitOpen ? " open" : "") + '" data-action="toggle-pile" data-pile="wait" aria-expanded="' + (waitOpen ? "true" : "false") + '">Chưa thuộc · ' + waitN + "</button>";
  html += "</div>";
  if (okOpen) html += '<div class="pile-list">' + ok + "</div>";
  if (waitOpen) html += '<div class="pile-list">' + wait + "</div>";
  return html;
}

function freshTestState() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.writeAlso = false;
  state.nudge = "";
  state.single = false;
  state.pileOk = false;
  state.pileWait = false;
}

function startBigTest(n) {
  var deck = bigDeck(n);
  state.bigTest = n;
  state.view = "test";
  state.queue = [];
  var i;
  for (i = 0; i < deck.length; i++) {
    var card = deck[i];
    if (!masteredFlags(lessonById(card.lessonId))[card.qIndex]) state.queue.push(card);
  }
  state.lessonId = deck[0].lessonId;
  freshTestState();
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function startTest(id) {
  var lesson = lessonById(id);
  var flags = masteredFlags(lesson);
  state.bigTest = 0;
  state.view = "test";
  state.lessonId = lesson.id;
  state.queue = [];
  for (var i = 0; i < lesson.questions.length; i++) if (!flags[i]) state.queue.push(i);
  freshTestState();
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function openCard() {
  state.phase = "write";
  state.draft = "";
  state.writeMsg = "";
  state.writeAlso = false;
  state.nudge = "";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.counted = false;
  render();
}

function showHint() {
  if (state.phase === "result") return;
  state.hintOpen = true;
  state.hintUsed = true;
  render();
}

function moveCard(how) {
  var card = state.queue.shift();
  if (how === "end") state.queue.push(card);
  else {
    var pos = Math.min(3, state.queue.length);
    state.queue.splice(pos, 0, card);
  }
  return card;
}

function checkTest() {
  if (state.phase === "result") return;
  if (!state.queue.length) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var card = state.queue[0];
  var big = state.bigTest > 0;
  var lesson = big ? lessonById(card.lessonId) : currentLesson();
  var qIndex = big ? card.qIndex : card;
  var q = lesson.questions[qIndex];
  var result = checkAnswer(raw, q);
  if (!normalize(raw)) {
    state.writeMsg = result.message;
    state.writeAlso = false;
    render();
    return;
  }
  if (result.alsoOk) {
    state.writeMsg = result.message;
    state.writeAlso = true;
    state.nudge = "";
    render();
    return;
  }
  state.writeAlso = false;
  state.phase = "result";
  state.writeMsg = "";
  if (result.ok && !state.hintUsed) {
    rememberSentence();
    masteredFlags(lesson)[qIndex] = true;
    saveProgress();
    state.queue.shift();
    state.result = { kind: "mastered", qIndex: qIndex, card: card, nudge: result.nudge || "" };
    state.draft = result.sentence;
  } else if (result.ok) {
    rememberSentence();
    moveCard("end");
    state.result = { kind: "hint", qIndex: qIndex, card: card, nudge: result.nudge || "" };
    state.draft = result.sentence;
  } else {
    moveCard("later");
    state.result = { kind: "wrong", qIndex: qIndex, card: card, message: result.message };
  }
  if (big) state.lessonId = lesson.id;
  render();
}

function retryWrite() {
  if (!state.result || state.result.kind !== "wrong") return;
  var card = state.result.card;
  var msg = state.result.message || "";
  var i = -1;
  var k;
  for (k = 0; k < state.queue.length; k++) if (sameCard(state.queue[k], card)) i = k;
  if (i >= 0) state.queue.splice(i, 1);
  state.queue.unshift(card);
  state.phase = "write";
  state.result = null;
  state.writeMsg = msg;
  state.hintOpen = state.hintUsed;
  render();
}

function nextCard() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.writeAlso = false;
  state.nudge = "";
  state.counted = false;
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function startReview() {
  var card = state.result ? state.result.card : state.queue[0];
  state.view = "learn";
  if (card && typeof card === "object") {
    state.lessonId = card.lessonId;
    state.qIndex = card.qIndex;
  } else state.qIndex = card;
  state.step = 1;
  state.single = true;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.writeAlso = false;
  state.nudge = "";
  state.counted = false;
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function returnToTest() {
  state.view = state.queue.length ? "test" : "celebrate";
  state.single = false;
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.pileOk = false;
  state.pileWait = false;
  render();
}

function resetTest() {
  var i;
  if (state.bigTest) {
    var deck = bigDeck(state.bigTest);
    for (i = 0; i < deck.length; i++) masteredFlags(lessonById(deck[i].lessonId))[deck[i].qIndex] = false;
    saveProgress();
    startBigTest(state.bigTest);
    return;
  }
  var lesson = currentLesson();
  var fresh = [];
  for (i = 0; i < lesson.questions.length; i++) fresh.push(false);
  progress.mastered[String(lesson.id)] = fresh;
  saveProgress();
  startTest(lesson.id);
}

function appendVocab(index) {
  var input = document.getElementById("answer-input");
  if (!input || input.disabled) return;
  var word = currentQuestion().vocab[Number(index)].en;
  var base = String(input.value).replace(/\s+$/, "");
  input.value = base ? base + " " + word : word;
  state.draft = input.value;
  state.writeMsg = "";
  var fb = document.getElementById("feedback");
  if (fb && state.view === "learn") fb.innerHTML = "";
  input.focus();
}

function setCopyStatus(msg) {
  var el = document.getElementById("copy-status");
  if (el) el.textContent = msg;
}

function copyParagraph() {
  var text = paragraphText();
  function legacy() {
    try {
      var node = document.getElementById("paragraph");
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(node);
      sel.removeAllRanges();
      sel.addRange(range);
      var done = document.execCommand("copy");
      sel.removeAllRanges();
      setCopyStatus(done ? "Đã sao chép." : "Bạn hãy chọn đoạn văn và chép tay nhé.");
    } catch (err) {
      setCopyStatus("Bạn hãy chọn đoạn văn và chép tay nhé.");
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setCopyStatus("Đã sao chép.");
      }).catch(function () { legacy(); });
      return;
    }
  } catch (err) {}
  legacy();
}

function onClick(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute("data-action");
  if (action === "continue") { startLearn(nextLesson().id); return; }
  if (action === "resume") {
    var lessonNow = currentLesson();
    var saved = progress.learned[String(lessonNow.id)] || [];
    var resumeAt = 0;
    for (var rq = 0; rq < lessonNow.questions.length; rq++) if (!saved[rq]) { resumeAt = rq; break; }
    state.view = "learn";
    state.single = false;
    goQuestion(resumeAt);
    return;
  }
  if (action === "retry-write") { state.writeMsg = ""; state.writeAlso = false; state.nudge = ""; render(); return; }
  if (action === "welcome") { state.view = "home"; render(); return; }
  if (action === "home" || action === "topics") { state.view = "topics"; render(); return; }
  if (action === "learn") { startLearn(btn.getAttribute("data-lesson")); return; }
  if (action === "to-list") { state.view = "lesson"; render(); return; }
  if (action === "open-q") { state.view = "learn"; state.single = false; goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "show-end") { state.view = "end"; render(); return; }
  if (action === "goto-q") { goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "goto-step") {
    var gs = Number(btn.getAttribute("data-step"));
    if (gs === 1) { state.step = 1; state.vocabOpen = false; render(); }
    else if (gs === 2) goGhep();
    else goWrite();
    return;
  }
  if (action === "test") { startTest(btn.getAttribute("data-lesson")); return; }
  if (action === "big-test") { startBigTest(Number(btn.getAttribute("data-big"))); return; }
  if (action === "to-ghep") { goGhep(); return; }
  if (action === "to-write") { goWrite(); return; }
  if (action === "pick") { pickWord(btn.getAttribute("data-id")); return; }
  if (action === "unpick") { unpickWord(btn.getAttribute("data-id")); return; }
  if (action === "check-write") { checkWrite(); return; }
  if (action === "next-q") { nextQuestion(); return; }
  if (action === "vocab") { appendVocab(btn.getAttribute("data-index")); return; }
  if (action === "rewrite") {
    progress.learned[String(state.lessonId)] = [];
    delete progress.finished[String(state.lessonId)];
    saveProgress();
    state.view = "lesson";
    render();
    return;
  }
  if (action === "copy") { copyParagraph(); return; }
  if (action === "open-card") { openCard(); return; }
  if (action === "check-test") { checkTest(); return; }
  if (action === "hint") { showHint(); return; }
  if (action === "retry") { retryWrite(); return; }
  if (action === "next-card") { nextCard(); return; }
  if (action === "review") { startReview(); return; }
  if (action === "reset-test") { resetTest(); return; }
  if (action === "review-lesson") { state.view = "lesson"; state.single = false; render(); return; }
  if (action === "toggle-vocab") { state.vocabOpen = !state.vocabOpen; render(); return; }
  if (action === "toggle-pile") {
    var pile = btn.getAttribute("data-pile");
    if (pile === "ok") state.pileOk = !state.pileOk;
    else if (pile === "wait") state.pileWait = !state.pileWait;
    render();
    return;
  }
}

function onKey(e) {
  if (e.key !== "Enter") return;
  if (!e.target || e.target.id !== "answer-input") return;
  e.preventDefault();
  if (state.view === "learn") checkWrite();
  else if (state.view === "test") checkTest();
}

function onInput(e) {
  if (!e.target || e.target.id !== "answer-input") return;
  state.draft = e.target.value;
  if (state.writeMsg && state.phase !== "result" && !state.writeOk) {
    state.writeMsg = "";
    var fb = document.getElementById("feedback");
    if (fb) fb.innerHTML = "";
  }
}

function boot() {
  progress = loadProgress();
  var app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("keydown", onKey);
  app.addEventListener("input", onInput);
  render();
}

if (typeof document !== "undefined") boot();
</script>
