<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Luyện viết tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #ffffff;
    --ink: #3e4556;
    --muted: #7b8496;
    --kicker: #8b93a6;
    --label: #6e7890;
    --vocab: #4c5870;
    --sentence: #7a6248;
    --line: #ece6f2;
    --primary: #d7e4f6;
    --primary-ink: #2c4468;
    --secondary: #6d7c96;
    --panel: #eef3fb;
    --chip: #e7eef8;
    --chip-ink: #3f4d68;
    --blank: #fff6dc;
    --blank-ink: #7a6248;
    --blank-line: #e6d3a1;
    --ok-bg: #e7f6ee;
    --ok-ink: #2f6b52;
    --ok-line: #cfe8db;
    --warn-bg: #fff4e6;
    --warn-ink: #8a6238;
    --warn-line: #f0ddc4;
    --shadow: 0 14px 34px rgba(92, 78, 120, 0.06);
    --well: #faf8fc;
    --tag: #efeaf8;
    --tag-ink: #6d6390;
    --soon-bg: #f7f5f8;
    --dot: #ddd6e8;
    --dot-done: #8aa4d4;
    --tone-1: #e7f0ff;
    --tone-2: #efe8fb;
    --tone-3: #e5f6ee;
    --tone-4: #fff6dc;
    --tone-5: #ffe9e4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% -10%, #efe7fb 0%, transparent 60%),
      radial-gradient(800px 380px at 100% 0%, #e5f4ef 0%, transparent 55%),
      #f7f5f8;
    -webkit-font-smoothing: antialiased;
    padding:
      env(safe-area-inset-top)
      env(safe-area-inset-right)
      env(safe-area-inset-bottom)
      env(safe-area-inset-left);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 3px solid #b7c6e4; outline-offset: 2px; }
  .wrap { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 64px; }
  h1 { font-size: 1.85rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; margin: 0; color: var(--ink); }
  h2 { font-size: 1.12rem; font-weight: 600; letter-spacing: -0.02em; margin: 0; line-height: 1.35; color: var(--ink); }
  p { margin: 0; }
  .hero { margin-bottom: 16px; }
  .hero .sub { margin-top: 6px; }
  .eyebrow { color: var(--kicker); margin-bottom: 6px; font-weight: 500; }
  .sub { margin-top: 8px; color: var(--muted); max-width: 40rem; }
  .count-pill {
    display: inline-block;
    margin-top: 14px;
    background: var(--ok-bg);
    color: var(--ok-ink);
    border: 1px solid var(--ok-line);
    border-radius: 999px;
    padding: 6px 12px;
    font-weight: 700;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid rgba(120, 108, 150, 0.08);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 18px 18px 16px;
  }
  .lesson { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
  .lesson-top { display: flex; gap: 14px; align-items: center; }
  .num {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 600;
    background: var(--tone-1);
    color: #5d7394;
  }
  .book {
    --bk: #bfe8d4;
    --bk-edge: #8fcdb2;
    flex: none;
    position: relative;
    width: 50px;
    height: 64px;
    margin: 2px 8px 6px 2px;
    border-radius: 3px 11px 11px 3px;
    background: var(--bk);
    box-shadow: 3px 4px 0 var(--bk-edge);
    color: #3f4a5c;
    font-size: 0.92rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 8px;
    transform: rotate(-4deg);
    transition: transform 0.28s ease;
  }
  .book::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: var(--bk-edge);
    border-radius: 3px 0 0 3px;
  }
  .book::after {
    content: "";
    position: absolute;
    top: 8px;
    left: 14px;
    right: 7px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.55);
  }
  .lesson:hover .book { transform: rotate(0deg) translateY(-3px); }
  .bk-1 { --bk: #bfe8d4; --bk-edge: #8fcdb2; }
  .bk-2 { --bk: #ffd6bd; --bk-edge: #f4b08a; }
  .bk-3 { --bk: #d8cdf6; --bk-edge: #b4a3e6; }
  .bk-4 { --bk: #c6dcf7; --bk-edge: #9bbfec; }
  .bk-5 { --bk: #f9cfe1; --bk-edge: #eba3c1; }
  .bk-6 { --bk: #fff0b8; --bk-edge: #ecd279; }
  .bk-7 { --bk: #cdeef2; --bk-edge: #98d3dc; }
  .bk-8 { --bk: #e3efc0; --bk-edge: #bcd584; }
  .bk-9 { --bk: #f6d3cf; --bk-edge: #e2a49d; }
  .bk-10 { --bk: #dcd9ee; --bk-edge: #b2aed3; }
  .bk-1, .bk-2, .bk-3, .bk-4, .bk-5, .bk-6, .bk-7, .bk-8, .bk-9, .bk-10 { --bkd: var(--bk-edge); }
  .unit { color: var(--label); font-size: 0.82rem; font-weight: 600; }
  .learned {
    margin-left: auto;
    background: var(--ok-bg);
    color: var(--ok-ink);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .desc { color: var(--muted); font-size: 0.95rem; }
  .tag {
    display: inline-block;
    background: var(--tag);
    color: var(--tag-ink);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .progress-line { font-weight: 500; color: var(--muted); font-size: 0.92rem; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
  .btn {
    appearance: none;
    border: 0;
    background: var(--primary);
    color: var(--primary-ink);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 16px;
    font-weight: 600;
  }
  .btn:hover { background: #c9daf2; }
  .btn-ghost {
    background: #ffffff;
    color: var(--secondary);
    border: 1px solid #e3dcec;
  }
  .btn-ghost:hover { background: #faf8fc; }
  .soon {
    background: var(--soon-bg);
    opacity: 0.72;
    box-shadow: none;
  }
  .soon-badge {
    margin-left: auto;
    border-radius: 999px;
    padding: 4px 10px;
    background: var(--tag);
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .foot {
    margin-top: 22px;
    color: var(--muted);
    font-size: 0.98rem;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
  }
  .topbar h2 { flex: 1; min-width: 0; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 99px; background: var(--dot); display: inline-block; }
  .front .ask, .front .vi, .front .tap { display: block; }
  .dot.done { background: var(--dot-done); }
  .dot.now { background: #8aa4d4; box-shadow: 0 0 0 4px rgba(138, 164, 212, 0.28); }
  .step-label { color: var(--muted); font-weight: 700; margin: 0 0 12px; }
  .split { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .grid > *, .split > * { min-width: 0; }
  .vocab-title { font-weight: 600; margin-bottom: 8px; }
  .vocab-note { color: var(--muted); font-size: 0.92rem; margin-bottom: 8px; }
  .vocab-list { display: flex; flex-direction: column; gap: 8px; }
  .vocab-row, .vocab-btn {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-width: 0;
    text-align: left;
    background: var(--well);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px;
    min-height: 48px;
  }
  .vocab-btn { cursor: pointer; }
  .vocab-en { font-weight: 700; min-width: 0; color: var(--vocab); }
  .vocab-vi { color: var(--muted); text-align: right; min-width: 0; }
  .qpanel { background: var(--panel); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
  .qpanel.tone-1 { background: var(--tone-1); }
  .qpanel.tone-2 { background: var(--tone-2); }
  .qpanel.tone-3 { background: var(--tone-3); }
  .qpanel.tone-4 { background: var(--tone-4); }
  .qpanel.tone-5 { background: var(--tone-5); }
  .ask { font-size: clamp(1.25rem, 2.4vw, 1.55rem); font-weight: 600; line-height: 1.3; color: var(--ink); }
  .vi { color: var(--muted); margin-top: 4px; }
  .label { font-weight: 700; margin: 12px 0 8px; color: var(--label); }
  .chips { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-start; }
  .chip-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; max-width: 220px; }
  .chip { display: inline-block; padding: 8px 12px; border-radius: 12px; font-weight: 600; line-height: 1.3; text-align: center; }
  .chip.fixed { background: var(--chip); color: var(--chip-ink); }
  .chip.blank { background: var(--blank); color: var(--blank-ink); border: 2px dashed var(--blank-line); }
  .chip-vi { font-size: 0.78rem; color: var(--muted); text-align: center; }
  .example { margin-top: 14px; padding-top: 4px; }
  .ex-en { font-size: 1.6rem; font-weight: 700; color: var(--sentence); line-height: 1.35; }
  .ex-vi { color: var(--muted); }
  .hint-line { color: var(--muted); margin-top: 8px; }
  .well {
    min-height: 76px;
    border: 2px dashed var(--line);
    border-radius: 16px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--well);
    margin: 8px 0;
  }
  .placeholder { color: var(--muted); align-self: center; }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .word {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    min-height: 48px;
    padding: 8px 14px;
    font-weight: 600;
  }
  .answer-input {
    width: 100%;
    border: 3px solid var(--bkd, var(--line));
    background: #fff;
    color: var(--ink);
    border-radius: 16px;
    padding: 14px 16px;
    min-height: 68px;
    margin: 8px 0 12px;
    font-size: 1.35rem;
    line-height: 1.4;
  }
  .answer-input:disabled { opacity: 0.85; }
  .fb { border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .fb p + p { margin-top: 6px; }
  .fb.ok { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--ok-line); }
  .fb.bad { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
  .fb .sample { font-weight: 700; color: var(--sentence); margin-top: 8px; }
  .para {
    font-size: clamp(1.25rem, 2.4vw, 1.55rem);
    line-height: 1.65;
    background: var(--panel);
    border-radius: 16px;
    padding: 18px;
    margin: 12px 0;
  }
  .center-col { max-width: 720px; margin: 0 auto; }
  .counters { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 0.92rem; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .pill.wait { background: var(--warn-bg); color: var(--warn-ink); }
  .front {
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 22px 18px;
    min-height: 180px;
  }
  .tap { margin-top: 18px; color: #6d7c96; font-weight: 600; }
  .big-emoji { font-size: 3rem; margin-bottom: 8px; }
  .copy-status { min-height: 1.4em; color: var(--ok-ink); font-weight: 700; margin-top: 8px; }
  .audience {
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    max-width: 44rem;
  }
  .audience strong { font-weight: 800; }
  .piles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .pile { border-radius: 18px; padding: 12px; min-height: 92px; }
  .pile.ok { background: var(--ok-bg); color: var(--ok-ink); border: 1px solid var(--ok-line); }
  .pile.wait { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
  .pile h3 { margin: 0 0 8px; font-size: 1rem; }
  .mini {
    background: var(--card);
    color: var(--ink);
    border-radius: 12px;
    padding: 8px 10px;
    margin-top: 6px;
    font-size: 0.92rem;
    box-shadow: 0 3px 0 rgba(36, 48, 68, 0.06);
  }
  .pile-empty { margin: 0; opacity: 0.8; }
  .noscript {
    margin: 24px;
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .topbar.slim { flex-wrap: nowrap; gap: 10px; margin-bottom: 12px; }
  .topbar.slim .dots, .topbar.slim .tag { margin-left: auto; flex: none; }
  .back {
    width: 44px;
    min-height: 44px;
    padding: 0;
    flex: none;
    font-size: 1.15rem;
  }
  .crumb {
    margin: 0;
    flex: 1;
    min-width: 0;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 0 14px; }
  .step {
    text-align: center;
    border-radius: 999px;
    padding: 8px 6px;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--line);
  }
  .step.on {
    background: var(--bk, var(--primary));
    color: #3e4556;
    border-color: transparent;
  }
  .study {
    background: #fff;
    background: color-mix(in srgb, var(--bk, #fff) 34%, #fff);
  }
  .study .btn:not(.btn-ghost) {
    background: var(--bk, var(--primary));
    color: #2c3a4e;
  }
  .study .btn:not(.btn-ghost):hover { background: var(--bkd, #c9daf2); }
  .ask-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 6px 12px;
    margin: 0 0 18px;
    text-align: center;
  }
  .ask-en { font-size: 1.05rem; font-weight: 600; line-height: 1.35; color: var(--ink); }
  .ask-vi { font-size: 0.88rem; color: var(--muted); }
  .study { text-align: center; }
  .study .chips { justify-content: center; margin-top: 18px; }
  .study .chip { font-size: 0.92rem; }
  .study .example { margin-top: 0; }
  .study .ex-en {
    font-size: clamp(1.9rem, 4.4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.25;
  }
  .study .ex-vi { text-align: center; margin-top: 6px; }
  .study .btn-row { justify-content: center; }
  .study .slot { justify-content: center; align-content: center; }
  .study .bank { justify-content: center; }
  .study .vchips { justify-content: center; }
  .study .answer-input { text-align: center; font-size: 1.5rem; }
  .vocab-toggle.on { background: color-mix(in srgb, var(--bk, var(--primary)) 50%, #fff); }
  .test-en {
    margin: 0;
    font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
  }
  .test-vi { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }
  .slot {
    min-height: 124px;
    border: 3px dashed var(--bkd, var(--line));
    border-radius: 18px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    background: #fff;
    background: color-mix(in srgb, var(--bk, #fff) 22%, #fff);
    margin: 0 0 10px;
  }
  .slot .word { font-size: 1.35rem; }
  .bank-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 12px;
    margin-top: 8px;
  }
  .bank-box .bank { margin-top: 0; }
  .bank-box .word { font-size: 1.15rem; }
  .vocab-drawer { margin-top: 16px; }
  .vchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .vchip {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
    text-align: left;
    line-height: 1.3;
  }
  button.vchip { cursor: pointer; font: inherit; color: inherit; }
  .vchip-en { font-weight: 700; font-size: 0.92rem; color: var(--vocab); }
  .vchip-vi { font-size: 0.78rem; color: var(--muted); }
  .hint-box { margin-top: 12px; }
  .hint-note { color: var(--muted); font-size: 0.88rem; margin-top: 8px; }
  .pile-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .pile-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    border-radius: 999px;
    min-height: 40px;
    padding: 6px 14px;
    font-weight: 600;
    font-size: 0.92rem;
  }
  .pile-btn.ok.open { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }
  .pile-btn.wait.open { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
  .pile-list { margin-top: 8px; }
  .topbar.slim, .steps, .card.focus { max-width: 720px; margin-left: auto; margin-right: auto; }
  .steps { display: flex; gap: 8px; margin: 0 0 14px; }
  .steps .st {
    flex: 1;
    text-align: center;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    padding: 7px 6px;
    border-radius: 999px;
    background: var(--soon-bg);
    border: 2px solid transparent;
    cursor: pointer;
  }
  .steps .st.done { background: var(--tone-3); color: #3f7a62; }
  .steps .st.now { background: var(--bk); border-color: var(--bkd); color: #3e4556; }
  .qline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 12px; margin-bottom: 14px; text-align: center; }
  .qline .ask { font-size: 1.15rem; font-weight: 700; }
  .qline .vi { color: var(--muted); font-size: 0.92rem; }
  .step-1 .example { text-align: center; }
  .step-1 .ex-en { font-size: 1.6rem; text-align: center; }
  .step-1 .chips, .step-3 .chips { justify-content: center; }
  .step-1 .btn-row { justify-content: center; }
  .step-2 .well {
    min-height: 124px;
    padding: 16px;
    gap: 10px;
    align-items: center;
    align-content: center;
    justify-content: center;
    border: 3px dashed var(--bkd);
    border-radius: 20px;
    background: #fff;
    background: color-mix(in srgb, var(--bk) 26%, #fff);
  }
  .step-2 .well .word { font-size: 1.35rem; }
  .step-2 .well.good { border-style: solid; border-color: #8fd3b0; background: #effaf4; }
  .step-2 .bank { justify-content: center; margin-top: 14px; padding: 14px; background: var(--well); border-radius: 16px; }

<script>
"use strict";

/*
  THÊM BÀI MỚI
  1. Copy một object trong mảng LESSONS (đủ 5 câu).

  Thứ tự chấm: trống → ___ hoặc [ ] → viết hoa chữ đầu → dấu . ! ?
  → errors (khớp quy tắc đầu tiên) → accept → đúng.
  Chữ xanh = từ cố định (blank:false). Ô vàng nét đứt = chỗ trống (blank:true).
  COMING_SOON để trống khi đã đủ 10 bài. Mỗi bài là một tình huống hỏi-đáp. Bài 10 trả lời bằng I will.

var UPPER = "A-ZÀÁẢÃẠĂẰẮẲẴẶÂẦẤẨẪẬĐÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴ";
var LOWER = "a-zàáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ";
var WORD = "[" + UPPER + "][" + UPPER + LOWER + "]*";
var NUMW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty";
var TIMEW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";

function flex(phrase) {
  var out = "";
  for (var i = 0; i < phrase.length; i++) {
    var ch = phrase.charAt(i);
    if (/[A-Za-z]/.test(ch)) out += "[" + ch.toUpperCase() + ch.toLowerCase() + "]";
    else if (ch === " ") out += " ";
    else if (ch === "'") out += "'";
    else out += "\\" + ch;
  }
  return out;
}

function re(source, flags) {
  return new RegExp(source, flags || "");
}

var nameStart = "(?:" + flex("My name is") + "|" + flex("I am") + "|" + flex("I'm") + ")";

  {
    id: 1,
    emoji: "💬",
    title: "Introduce Yourself",
    vi: "Trả lời khi người khác chào bạn",

    opener: "Hello! ",
    questions: [
      {
        id: "1.1",
        ask: "What's your name?",
        vi: "Bạn tên là gì?",
        formula: [
          { text: "My name is", vi: "Tên tôi là", blank: false },
          { text: "[tên bạn]", vi: "viết hoa chữ đầu", blank: true }

        example: "My name is Lan.",
        exampleVi: "Tên tôi là Lan.",
        vocab: [
          { en: "My name is", vi: "Tên tôi là" },
          { en: "Lan", vi: "Lan" },
          { en: "Minh", vi: "Minh" },
          { en: "Hoa", vi: "Hoa" }

          [/^My name (?:am|are)\b/i, "Sau 'My name' dùng **is**. ✅ My name is Lan."],
          [/^My name (?!is\b)\S/i, "Thiếu **is**. ✅ My name is Lan."],
          [nameLower, "Tên phải **viết hoa chữ cái đầu**: Lan, không phải lan."]
        ]
      },
      {
        id: "1.2",
        ask: "How old are you?",
        vi: "Bạn bao nhiêu tuổi?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[số]", vi: "ví dụ: 10", blank: true },
          { text: "years old", vi: "tuổi", blank: false }
        ],
        example: "I am 10 years old.",
        exampleVi: "Tôi 10 tuổi.",
        vocab: [

function normalize(raw) {
  var s = String(raw == null ? "" : raw).replace(/[’‘‛]/g, "'").replace(/\s+/g, " ").trim();
  return s.replace(/\s+([.!?])$/, "$1");
}

function checkAnswer(raw, question) {
  var s = normalize(raw);
  if (!s) return { ok: false, message: "Hãy viết câu trả lời của bạn trước nhé." };
  if (/___|\[|\]/.test(s)) return { ok: false, message: "Hãy thay phần [ ] bằng từ của bạn." };
  if (!re("^[" + UPPER + "]").test(s)) {
    return { ok: false, message: "Chữ cái đầu câu phải **viết hoa**." };
  }
  if (!/[.!?]$/.test(s)) return { ok: false, message: "Cuối câu cần có **dấu chấm (.)**." };
  var i;
  for (i = 0; i < question.errors.length; i++) {
    if (question.errors[i][0].test(s)) return { ok: false, message: question.errors[i][1] };
  }
  if (!question.accept.test(s)) {
    return { ok: false, message: "Câu chưa đúng mẫu. Hãy nhìn lại **công thức** và ví dụ ở trên nhé." };
  }
  return { ok: true, sentence: s };
}

function lessonById(id) {
  var n = Number(id);
  for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === n) return LESSONS[i];
  return LESSONS[0];
}

function currentLesson() { return lessonById(state.lessonId); }

function bookClass(lesson) {
  return "bk-" + (((lesson.id - 1) % 10) + 1);

function defaultProgress() {
  return { sentences: 0, finished: {}, mastered: {}, learned: {} };
}

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    var data = JSON.parse(raw);
    var p = defaultProgress();
    if (data && typeof data.sentences === "number" && isFinite(data.sentences) && data.sentences >= 0) {
      p.sentences = Math.floor(data.sentences);
    }
    if (data && data.finished && typeof data.finished === "object") p.finished = data.finished;
    if (data && data.mastered && typeof data.mastered === "object") p.mastered = data.mastered;
    if (data && data.learned && typeof data.learned === "object") p.learned = data.learned;
    return p;
  } catch (err) {
    return defaultProgress();
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (err) {}
}

function masteredFlags(lesson) {
  var id = String(lesson.id);
  var n = lesson.questions.length;
  var arr = progress.mastered[id];
  if (!Array.isArray(arr) || arr.length !== n) {
    var old = Array.isArray(arr) ? arr : [];
    arr = [];
    for (var i = 0; i < n; i++) arr.push(!!old[i]);
    progress.mastered[id] = arr;
  }
  return arr;
}

function masteredCount(lesson) {
  var flags = masteredFlags(lesson);
  var n = 0;
  for (var i = 0; i < flags.length; i++) if (flags[i]) n++;
  return n;
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatMsg(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

    html += '<div class="chip-wrap"><span class="chip ' + (ch.blank ? "blank" : "fixed") + '">' + esc(ch.text) + "</span>";
    if (gloss) html += '<span class="chip-vi">' + esc(ch.vi) + "</span>";
    html += "</div>";
  }
  return html + "</div>";
}

function fisher(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function shuffledTokens(sentence) {
  var words = sentence.split(" ");
  var tokens = [];
  for (var i = 0; i < words.length; i++) tokens.push({ id: String(i), text: words[i] });
  var original = words.join(" ");
  var order = tokens.slice();
  for (var n = 0; n < 20; n++) {
    order = fisher(tokens);
    var joined = [];
    for (var k = 0; k < order.length; k++) joined.push(order[k].text);
    if (joined.join(" ") !== original) return order;
  }
  return tokens.slice().reverse();
}

function startLearn(id) {
  state.view = "lesson";
  state.lessonId = Number(id);
  state.single = false;
  state.vocabOpen = false;
  render();
}

function goQuestion(i) {
  state.qIndex = i;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function goGhep() {
  var q = currentQuestion();
  state.step = 2;
  state.bank = shuffledTokens(q.example);
  state.picked = [];
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function goWrite() {
  state.step = 3;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function pickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  var i;
  for (i = 0; i < state.bank.length; i++) if (state.bank[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.bank.splice(idx, 1)[0];
  state.picked.push(tok);
  if (!state.bank.length) {
    var built = [];
    for (i = 0; i < state.picked.length; i++) built.push(state.picked[i].text);
    state.ghepChecked = true;
    state.ghepOk = built.join(" ") === currentQuestion().example;
  } else {
    state.ghepChecked = false;
    state.ghepOk = false;
  }
  render();
}

function unpickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  for (var i = 0; i < state.picked.length; i++) if (state.picked[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.picked.splice(idx, 1)[0];
  state.bank.push(tok);
  state.ghepChecked = false;
  state.ghepOk = false;
  render();
}

function rememberSentence() {
  if (state.counted) return;
  progress.sentences += 1;
  state.counted = true;
  saveProgress();
}

function checkWrite() {
  if (state.writeOk) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var result = checkAnswer(raw, currentQuestion());
  if (!result.ok) {
    state.writeMsg = result.message;
    state.writeOk = false;
    render();
    return;
  }
  rememberSentence();
  if (!state.single) {
    var lid = String(currentLesson().id);
    if (!progress.learned[lid]) progress.learned[lid] = [];
    progress.learned[lid][state.qIndex] = result.sentence;
    state.answers[state.qIndex] = result.sentence;
    if (allLearned(currentLesson())) progress.finished[lid] = true;
    saveProgress();
  }
  state.draft = result.sentence;
  state.writeMsg = "";
  state.writeOk = true;
  render();
}

function nextQuestion() {
  if (state.single) {
    returnToTest();
    return;
  }
  var lesson = currentLesson();
  if (state.qIndex >= lesson.questions.length - 1) {
    if (allLearned(lesson)) {
      progress.finished[String(lesson.id)] = true;
      saveProgress();
    }
    state.view = "lesson";
    render();
    return;
  }
  state.qIndex += 1;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function startTest(id) {
  var lesson = lessonById(id);
  var flags = masteredFlags(lesson);
  state.view = "test";
  state.lessonId = lesson.id;
  state.queue = [];
  for (var i = 0; i < lesson.questions.length; i++) if (!flags[i]) state.queue.push(i);
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.single = false;
  state.pileOk = false;
  state.pileWait = false;
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function openCard() {
  state.phase = "write";
  state.draft = "";
  state.writeMsg = "";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.counted = false;
  render();
}

function showHint() {
  if (state.phase === "result") return;
  state.hintOpen = true;
  state.hintUsed = true;
  render();
}

function moveCard(how) {
  var card = state.queue.shift();
  if (how === "end") state.queue.push(card);
  else {
    var pos = Math.min(3, state.queue.length);
    state.queue.splice(pos, 0, card);
  }
  return card;
}

function checkTest() {
  if (state.phase === "result") return;
  if (!state.queue.length) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var qIndex = state.queue[0];
  var q = currentLesson().questions[qIndex];
  var result = checkAnswer(raw, q);
  if (!normalize(raw)) {
    state.writeMsg = result.message;
    render();
    return;
  }
  state.phase = "result";
  state.writeMsg = "";
  if (result.ok && !state.hintUsed) {
    rememberSentence();
    masteredFlags(currentLesson())[qIndex] = true;
    saveProgress();
    state.queue.shift();
    state.result = { kind: "mastered", qIndex: qIndex };
    state.draft = result.sentence;
  } else if (result.ok) {
    rememberSentence();
    moveCard("end");
    state.result = { kind: "hint", qIndex: qIndex };
    state.draft = result.sentence;
  } else {
    moveCard("later");
    state.result = { kind: "wrong", qIndex: qIndex, message: result.message };
  }
  render();
}

function retryWrite() {
  if (!state.result || state.result.kind !== "wrong") return;
  var qIndex = state.result.qIndex;
  var msg = state.result.message || "";
  var i = -1;
  var k;
  for (k = 0; k < state.queue.length; k++) if (state.queue[k] === qIndex) i = k;
  if (i >= 0) state.queue.splice(i, 1);
  state.queue.unshift(qIndex);
  state.phase = "write";
  state.result = null;
  state.writeMsg = msg;
  state.hintOpen = state.hintUsed;
  render();
}

function nextCard() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.counted = false;
  if (!state.queue.length) state.view = "celebrate";

function startReview() {
  var qIndex = state.result ? state.result.qIndex : state.queue[0];
  state.view = "learn";

  state.step = 1;
  state.single = true;
  state.draft = "";
  state.writeMsg = "";

function returnToTest() {
  state.view = state.queue.length ? "test" : "celebrate";
  state.single = false;
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";

  state.pileWait = false;

function setCopyStatus(msg) {
  var el = document.getElementById("copy-status");
  if (el) el.textContent = msg;
}

function copyParagraph() {
  var text = paragraphText();
  function legacy() {
    try {
      var node = document.getElementById("paragraph");
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(node);
      sel.removeAllRanges();
      sel.addRange(range);
      var done = document.execCommand("copy");
      sel.removeAllRanges();
      setCopyStatus(done ? "Đã sao chép." : "Bạn hãy chọn đoạn văn và chép tay nhé.");
    } catch (err) {
      setCopyStatus("Bạn hãy chọn đoạn văn và chép tay nhé.");
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setCopyStatus("Đã sao chép.");
      }).catch(function () { legacy(); });
      return;
    }
  } catch (err) {}
  legacy();
}

function onClick(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute("data-action");
  if (action === "welcome") { state.view = "home"; render(); return; }
  if (action === "home" || action === "topics") { state.view = "topics"; render(); return; }
  if (action === "learn") { startLearn(btn.getAttribute("data-lesson")); return; }
  if (action === "to-list") { state.view = "lesson"; render(); return; }
  if (action === "open-q") { state.view = "learn"; state.single = false; goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "show-end") { state.view = "end"; render(); return; }
  if (action === "goto-q") { goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "goto-step") {
    var gs = Number(btn.getAttribute("data-step"));
    if (gs === 1) { state.step = 1; state.vocabOpen = false; render(); }
    else if (gs === 2) goGhep();
    else goWrite();
    return;
  }
  if (action === "test") { startTest(btn.getAttribute("data-lesson")); return; }
  if (action === "to-ghep") { goGhep(); return; }
  if (action === "to-write") { goWrite(); return; }
  if (action === "pick") { pickWord(btn.getAttribute("data-id")); return; }
  if (action === "unpick") { unpickWord(btn.getAttribute("data-id")); return; }
  if (action === "check-write") { checkWrite(); return; }
  if (action === "next-q") { nextQuestion(); return; }
  if (action === "vocab") { appendVocab(btn.getAttribute("data-index")); return; }
  if (action === "rewrite") {
    progress.learned[String(state.lessonId)] = [];
    delete progress.finished[String(state.lessonId)];
    saveProgress();
    state.view = "lesson";
    render();
    return;
  }
  if (action === "copy") { copyParagraph(); return; }
  if (action === "open-card") { openCard(); return; }
  if (action === "check-test") { checkTest(); return; }
  if (action === "hint") { showHint(); return; }
  if (action === "retry") { retryWrite(); return; }
  if (action === "next-card") { nextCard(); return; }
  if (action === "review") { startReview(); return; }
  if (action === "reset-test") { resetTest(); return; }
  if (action === "review-lesson") { state.view = "lesson"; state.single = false; render(); return; }
  if (action === "toggle-vocab") { state.vocabOpen = !state.vocabOpen; render(); return; }
  if (action === "toggle-pile") {
    var pile = btn.getAttribute("data-pile");
    if (pile === "ok") state.pileOk = !state.pileOk;
    else if (pile === "wait") state.pileWait = !state.pileWait;
    render();
    return;
  }
}

function onKey(e) {
  if (e.key !== "Enter") return;
  if (!e.target || e.target.id !== "answer-input") return;
  e.preventDefault();
  if (state.view === "learn") checkWrite();
  else if (state.view === "test") checkTest();
}

function onInput(e) {
  if (!e.target || e.target.id !== "answer-input") return;
  state.draft = e.target.value;
  if (state.writeMsg && state.phase !== "result" && !state.writeOk) {
    state.writeMsg = "";
    var fb = document.getElementById("feedback");
    if (fb) fb.innerHTML = "";
  }
}

function boot() {
  progress = loadProgress();
  var app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("keydown", onKey);
  app.addEventListener("input", onInput);
  render();
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
