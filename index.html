<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Luyện viết tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#5b3a29;--muted:#a58570;--line:#f1dfcb;--coral:#e8735a;--coral-ink:#c4553d;--coral-soft:#fde0d2;--coral-pale:#fff1ea;--paper:#fffaf3;--peach:#ffe8d8;--pink:#fbe3e6;--sand:#f3ebe0;--hill1:#fbdcc8;--hill2:#f5c6ab;--shadow:0 12px 28px rgba(176,110,70,.14);--mH:clamp(150px,34dvh,330px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Nunito","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;font-weight:600;color:var(--ink);background:radial-gradient(900px 520px at 0% 0%,#ffe9d8 0%,transparent 60%),radial-gradient(900px 520px at 100% 100%,#ffe3d2 0%,transparent 55%),#fff6ec;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{padding:24px;text-align:center}
.wrap{height:100%}
.scene{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center}
.col{position:relative;z-index:1;width:min(1040px,100%);height:100%;display:flex;flex-direction:column;padding:14px 22px 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.enter .content>*,.enter .bubble{animation:rise .38s ease backwards}
.enter .content>*:nth-child(2){animation-delay:.05s}.enter .content>*:nth-child(3){animation-delay:.1s}.enter .content>*:nth-child(4){animation-delay:.15s}
.char{display:block;height:var(--mH);width:auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(150,80,50,.18))}
@media (prefers-reduced-motion:reduce){.enter .content>*,.enter .bubble,.char{animation:none}}
/* header */
.head{flex:none;display:flex;align-items:center;gap:12px;min-height:48px}
.back{appearance:none;border:0;background:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);margin-left:-8px}
.back:hover{background:var(--coral-pale)}.back svg{width:24px;height:24px}
.htitle{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{flex:none;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800}
.qnums{display:flex;gap:2px}
.qn{appearance:none;border:0;background:none;width:34px;height:34px;border-radius:50%;font-weight:800;color:var(--muted)}
.qn.done{color:var(--coral-ink);background:var(--coral-pale)}
.qn.now{background:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(232,115,90,.35)}
/* stepper */
.stepper{flex:none;display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.stp{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;padding:4px 0;font-weight:800;color:var(--muted)}
.stp i{width:26px;height:26px;border-radius:50%;border:2px solid #f0cdbd;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:#fff}
.stp.done i{background:var(--coral-soft);border-color:var(--coral-soft);color:var(--coral-ink)}
.stp.now{color:var(--ink)}.stp.now i{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(232,115,90,.35)}
.sep{flex:1;height:2px;border-radius:2px;background:var(--line);min-width:16px;max-width:120px}
/* main layout */
.main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,32%,360px);gap:28px}
.content{overflow-y:auto;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:clamp(4px,3dvh,28px)}
.char-zone{position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.bubble{position:absolute;left:0;right:0;bottom:calc(var(--mH) + 18px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);font-weight:700;line-height:1.45;font-size:.98rem;max-height:calc(100% - var(--mH) + 40px);overflow:auto;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble p{margin:0 0 4px}.bubble p:last-child{margin:0}.bubble .sample{color:var(--coral-ink);font-weight:800}
/* ground + dock */
.ground{position:relative;flex:none;height:92px;display:flex;align-items:center;justify-content:center}
.ground::before{content:"";position:absolute;left:-50vw;right:-50vw;top:0;bottom:-120px;background:linear-gradient(var(--hill1),var(--hill2));border-radius:50% 50% 0 0/46px 46px 0 0;z-index:0}
.dock{position:relative;z-index:1;display:flex;gap:4px;padding:6px;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border-radius:999px;box-shadow:var(--shadow)}
.dk{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;padding:9px 20px;border-radius:999px;font-weight:800;color:var(--muted)}
.dk svg{width:20px;height:20px}.dk.on{background:var(--coral-soft);color:var(--coral-ink)}
/* question + frame */
.qline{display:flex;flex-direction:column;gap:2px}
.qline .ask{font-size:clamp(1.7rem,4.4vw,2.8rem);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.qline .vi{color:var(--muted);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.chip-wrap{display:flex;flex-direction:column;gap:2px}
.chip{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:800}
.chip.fixed{padding:0 4px;box-shadow:inset 0 -12px 0 rgba(232,115,90,.22);border-radius:4px}
.chip.blank{padding:0 14px;color:var(--coral-ink);border-bottom:3px dotted var(--coral)}
.chip-vi{color:var(--muted);font-size:.8rem}
.example{margin:0}.ex-en{margin:0;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800;color:var(--coral-ink)}
/* ghép */
.well{width:100%;min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 2px 10px;border-bottom:3px dotted #f0b9a5}
.well.good{border-bottom:3px solid var(--coral);background:linear-gradient(var(--coral-pale),transparent)}
.placeholder{color:var(--muted);font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{appearance:none;border:1px solid #f0dcc8;background:#fff;border-radius:16px;padding:9px 18px;min-height:46px;font-size:1.15rem;font-weight:800;box-shadow:0 4px 0 #f0dcc8;transition:transform .12s ease}
.word:hover{transform:translateY(-2px)}.well .word{border-color:#f0b9a5;box-shadow:0 4px 0 #f0b9a5}
/* viết */
.writeline{width:100%;display:flex;align-items:center;gap:12px}
.answer-input{flex:1;min-width:0;border:0;border-bottom:3px solid #f0dcc8;background:transparent;border-radius:0;padding:10px 4px;font:inherit;font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:700;color:var(--ink);outline:none;transition:border-color .2s}
.answer-input::placeholder{color:#d2b8a6;font-weight:600}
.answer-input:focus{border-bottom-color:var(--coral)}
.answer-input.good,.answer-input:disabled.good{border-bottom-color:var(--coral);color:var(--coral-ink);background:linear-gradient(var(--coral-pale),transparent);opacity:1}
.go{appearance:none;border:0;flex:none;width:56px;height:56px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(232,115,90,.35);transition:transform .15s ease}
.go:hover{transform:scale(1.06)}.go:disabled{background:#f3d3c7;box-shadow:none}.go svg{width:26px;height:26px}
/* buttons */
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:0;background:var(--coral);color:#fff;border-radius:999px;min-height:52px;padding:0 30px;font-weight:800;font-size:1.05rem;box-shadow:0 8px 18px rgba(232,115,90,.3);transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}.btn:disabled{background:#f3d3c7;box-shadow:none}
.btn-ghost{background:transparent;color:var(--coral-ink);box-shadow:none;border:1.5px solid #f3c7b6}
.linkbtn{appearance:none;border:0;background:none;color:var(--coral-ink);font-weight:800;padding:6px 2px;display:inline-flex;align-items:center;gap:8px}
.linkbtn svg{width:18px;height:18px}
.vwrap{width:100%}
.vtoggle{appearance:none;border:0;background:none;color:var(--coral-ink);font-weight:800;padding:6px 2px}
.vtoggle::before{content:"✦ "}.vtoggle.open::before{content:"✕ "}.vtoggle.open{background:var(--coral-pale);border-radius:999px;padding:6px 14px}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vchip{appearance:none;display:flex;flex-direction:column;text-align:left;gap:0;border:1px solid #f7d9cc;background:var(--coral-pale);border-radius:14px;padding:6px 12px}
button.vchip:hover{border-color:var(--coral)}.vchip-en{font-weight:800}.vchip-vi{font-size:.78rem;color:var(--muted)}
.hint-box{width:100%}.hint-note{margin:6px 0 0;color:var(--muted);font-size:.85rem}
/* piles */
.pile-row{display:flex;gap:16px;margin-top:4px}
.pile-btn{appearance:none;border:0;background:none;padding:6px 0;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.pile-btn.open{color:var(--coral-ink);border-bottom-color:var(--coral)}
.pile-list{width:100%;max-height:22dvh;overflow:auto}.mini{padding:5px 0;border-bottom:1px solid var(--line)}.pile-empty{color:var(--muted);margin:6px 0}
/* landing */
.landing .col{align-items:center;text-align:center}
.landing .lm{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;padding-top:4dvh}
.landing .bubble{position:relative;left:auto;right:auto;top:auto;bottom:auto;max-width:min(560px,92%);font-size:clamp(1.15rem,3.4vw,1.55rem);padding:16px 22px;max-height:none;overflow:visible}
.landing .char{--mH:clamp(170px,38dvh,380px)}
.landing .ground{height:auto;min-height:130px;flex-direction:column;gap:8px;padding:10px 0 14px}
.landing .btn{position:relative;z-index:1;min-height:58px;padding:0 54px;font-size:1.15rem}
.note{position:relative;z-index:1;margin:0;font-size:.82rem;color:#9a6d55}
/* topics */
.tgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-content:start;padding:8px 2px 24px}
.tile{appearance:none;border:0;text-align:left;border-radius:26px;padding:14px 16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:0 6px 14px rgba(176,110,70,.1);transition:transform .18s ease,box-shadow .18s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(176,110,70,.16)}
.tone-peach{background:#ffd6c2}.tone-pink{background:#f6d0d8}.tone-sand{background:#e9dccb}.tone-sage{background:#d5e6c8}
.trow{display:flex;justify-content:space-between;align-items:center}
.ticon svg{width:36px;height:36px;display:block}.tmeta{font-size:.82rem;font-weight:800;color:var(--muted)}
.ttitle{font-size:1.05rem;font-weight:800;line-height:1.2}
.thill{flex:none;height:34px}
.thill.ground{height:34px}
/* lesson list */
.qlist{width:100%;display:flex;flex-direction:column}
.qrow{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;display:flex;align-items:center;gap:14px;text-align:left;padding:13px 4px;width:100%;transition:background .15s}
.qrow:hover{background:linear-gradient(90deg,var(--coral-pale),transparent)}
.qmark{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--peach);color:var(--coral-ink)}
.qrow.done .qmark{background:var(--coral);color:#fff}
.qtext b{display:block;font-size:1.08rem;font-weight:800}.qtext small{color:var(--muted);font-size:.9rem}
.list-title{margin:0;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}.sub{margin:0;color:var(--muted)}
.para{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;font-size:1.2rem;line-height:1.6;box-shadow:var(--shadow)}
.copy-status{margin:0;color:var(--muted);font-size:.85rem}
.desc{margin:0;color:var(--muted)}
/* phone */
@media (max-width:760px){
  .col{padding:10px 16px 0}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:6px;align-content:start}
  .char-zone{order:-1;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
  .char{--mH:92px}
  .bubble{position:relative;bottom:auto;flex:1;max-height:none;margin-bottom:14px;font-size:.92rem;padding:10px 14px}
  .bubble::after{left:auto;right:-8px;bottom:14px;transform:rotate(-45deg);border:0;border-top:1px solid var(--line);border-right:1px solid var(--line)}
  .landing .bubble{flex:none;margin:0}.landing .bubble::after{left:50%;right:auto;bottom:-8px;transform:translateX(-50%) rotate(45deg);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .char-zone .char{order:2}
  .ground{height:76px}.dk{padding:8px 16px}
  .stepper{gap:6px}.stp span{font-size:.9rem}
  .tgrid{grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:92px;padding:12px}
  .go{width:50px;height:50px}
  .btn{padding:0 20px;min-height:48px;font-size:1rem}.btn-row{gap:8px}
  .landing .ground{min-height:118px}
}
@media (max-width:760px) and (max-height:700px){.list .char-zone{display:none}}
.list .content{overflow-y:auto}
.vopen .content{gap:8px}.vopen .qline .ask{font-size:clamp(1.4rem,3vw,1.9rem)}.vopen .chip{font-size:1.1rem}
@media (max-height:700px){.vopen .vchip{padding:3px 9px}.vopen .vchip-vi{font-size:.7rem}.vopen .vchips{gap:5px;margin-top:6px}.vopen .qline .vi{display:none}.vopen .go{width:46px;height:46px}.vopen .answer-input{padding:6px 4px}}
@media (max-height:620px){.qrow{padding:7px 4px}.qmark{width:30px;height:30px}.qtext b{font-size:1rem}.list-title{font-size:1.5rem}.content{gap:10px}.qline .ask{font-size:1.6rem}.well{min-height:56px}.ground{height:72px}.dk{padding:7px 16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><p class="noscript">Bạn cần bật JavaScript để học bài này.</p></noscript>
<script>
"use strict";

/*
  THÊM BÀI MỚI
  1. Copy một object trong mảng LESSONS (đủ 5 câu).
  2. Đổi id, emoji, title, vi, tag, opener.
  3. Mỗi câu hỏi gồm: ask, vi, formula [{text, vi, blank}],
     example, exampleVi, vocab [{en, vi}], accept (RegExp),
     errors [[RegExp, "thông báo"]].
  4. Câu ví dụ phải khớp accept và không khớp errors.
  Thứ tự chấm: trống → ___ hoặc [ ] → viết hoa chữ đầu → dấu . ! ?
  → errors (khớp quy tắc đầu tiên) → accept → đúng.
  Chữ xanh = từ cố định (blank:false). Ô vàng nét đứt = chỗ trống (blank:true).
  COMING_SOON để trống khi đã đủ 10 bài. Mỗi bài là một tình huống hỏi-đáp. Bài 10 trả lời bằng I will.
*/

var UPPER = "A-ZÀÁẢÃẠĂẰẮẲẴẶÂẦẤẨẪẬĐÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴ";
var LOWER = "a-zàáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ";
var WORD = "[" + UPPER + "][" + UPPER + LOWER + "]*";
var NUMW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty";
var TIMEW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";

function flex(phrase) {
  var out = "";
  for (var i = 0; i < phrase.length; i++) {
    var ch = phrase.charAt(i);
    if (/[A-Za-z]/.test(ch)) out += "[" + ch.toUpperCase() + ch.toLowerCase() + "]";
    else if (ch === " ") out += " ";
    else if (ch === "'") out += "'";
    else out += "\\" + ch;
  }
  return out;
}

function re(source, flags) {
  return new RegExp(source, flags || "");
}

var nameStart = "(?:" + flex("My name is") + "|" + flex("I am") + "|" + flex("I'm") + ")";
var nameAccept = re("^" + nameStart + " " + WORD + "(?: " + WORD + ")*[.!?]$");
var nameLower = re("^" + nameStart + "(?: " + WORD + ")* [" + LOWER + "]");
var placeStart = flex("I live in");
var placeAccept = re("^" + placeStart + " " + WORD + "(?: " + WORD + ")*[.!?]$");
var placeLower = re("^" + placeStart + "(?: " + WORD + ")* [" + LOWER + "]");

var LESSONS = [
  {
    id: 1,
    emoji: "💬",
    title: "Introduce Yourself",
    vi: "Trả lời khi người khác chào bạn",
    tag: "My name is / I am",
    opener: "Hello! ",
    questions: [
      {
        id: "1.1",
        ask: "What's your name?",
        vi: "Bạn tên là gì?",
        formula: [
          { text: "My name is", vi: "Tên tôi là", blank: false },
          { text: "[tên bạn]", vi: "viết hoa chữ đầu", blank: true }
        ],
        example: "My name is Lan.",
        exampleVi: "Tên tôi là Lan.",
        vocab: [
          { en: "My name is", vi: "Tên tôi là" },
          { en: "Lan", vi: "Lan" },
          { en: "Minh", vi: "Minh" },
          { en: "Hoa", vi: "Hoa" }
        ],
        accept: nameAccept,
        errors: [
          [/^My name (?:am|are)\b/i, "Sau 'My name' dùng **is**. ✅ My name is Lan."],
          [/^My name (?!is\b)\S/i, "Thiếu **is**. ✅ My name is Lan."],
          [nameLower, "Tên phải **viết hoa chữ cái đầu**: Lan, không phải lan."]
        ]
      },
      {
        id: "1.2",
        ask: "How old are you?",
        vi: "Bạn bao nhiêu tuổi?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[số]", vi: "ví dụ: 10", blank: true },
          { text: "years old", vi: "tuổi", blank: false }
        ],
        example: "I am 10 years old.",
        exampleVi: "Tôi 10 tuổi.",
        vocab: [
          { en: "I am", vi: "Tôi" },
          { en: "10", vi: "mười" },
          { en: "years old", vi: "tuổi" },
          { en: "eleven", vi: "mười một" }
        ],
        accept: re("^(?:I am|I'm) (?:\\d{1,3}|" + NUMW + ") years old[.!?]$", "i"),
        errors: [
          [/^I have\b/i, "Nói tuổi bằng **am**, không dùng have. ✅ I am 10 years old."],
          [/^I (?:is|are)\b/i, "'I' đi với **am**."],
          [/^(?:I am|I'm) years old[.!?]$/i, "Thiếu số tuổi."],
          [re("^(?:I am|I'm) (?:\\d{1,3}|" + NUMW + ") year old\\b", "i"), "Dùng **years**, vì đây là số nhiều."]
        ]
      },
      {
        id: "1.3",
        ask: "How are you?",
        vi: "Bạn khỏe không?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[cảm giác]", vi: "ví dụ: fine", blank: true }
        ],
        example: "I am fine.",
        exampleVi: "Tôi khỏe.",
        vocab: [
          { en: "I am", vi: "Tôi" },
          { en: "fine", vi: "khỏe" },
          { en: "good", vi: "tốt" },

function normalize(raw) {
  var s = String(raw == null ? "" : raw).replace(/[’‘‛]/g, "'").replace(/\s+/g, " ").trim();
  return s.replace(/\s+([.!?])$/, "$1");
}

function checkAnswer(raw, question) {
  var s = normalize(raw);
  if (!s) return { ok: false, message: "Hãy viết câu trả lời của bạn trước nhé." };
  if (/___|\[|\]/.test(s)) return { ok: false, message: "Hãy thay phần [ ] bằng từ của bạn." };
  if (!re("^[" + UPPER + "]").test(s)) {
    return { ok: false, message: "Chữ cái đầu câu phải **viết hoa**." };
  }
  if (!/[.!?]$/.test(s)) return { ok: false, message: "Cuối câu cần có **dấu chấm (.)**." };
  var i;
  for (i = 0; i < question.errors.length; i++) {
    if (question.errors[i][0].test(s)) return { ok: false, message: question.errors[i][1] };
  }
  if (!question.accept.test(s)) {
    return { ok: false, message: "Câu chưa đúng mẫu. Hãy nhìn lại **công thức** và ví dụ ở trên nhé." };
  }
  return { ok: true, sentence: s };
}

function lessonById(id) {

  for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === n) return LESSONS[i];

function defaultProgress() {
  return { sentences: 0, finished: {}, mastered: {}, learned: {} };
}

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    var data = JSON.parse(raw);
    var p = defaultProgress();
    if (data && typeof data.sentences === "number" && isFinite(data.sentences) && data.sentences >= 0) {
      p.sentences = Math.floor(data.sentences);
    }
    if (data && data.finished && typeof data.finished === "object") p.finished = data.finished;
    if (data && data.mastered && typeof data.mastered === "object") p.mastered = data.mastered;
    if (data && data.learned && typeof data.learned === "object") p.learned = data.learned;
    return p;
  } catch (err) {
    return defaultProgress();
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (err) {}
}

function masteredFlags(lesson) {
  var id = String(lesson.id);
  var n = lesson.questions.length;
  var arr = progress.mastered[id];
  if (!Array.isArray(arr) || arr.length !== n) {
    var old = Array.isArray(arr) ? arr : [];
    arr = [];
    for (var i = 0; i < n; i++) arr.push(!!old[i]);
    progress.mastered[id] = arr;
  }
  return arr;
}

function masteredCount(lesson) {
  var flags = masteredFlags(lesson);
  var n = 0;
  for (var i = 0; i < flags.length; i++) if (flags[i]) n++;
  return n;
}

function esc(s) {
  return String(s)

  else if (state.view === "learn") html = renderLearn();

function fisher(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function shuffledTokens(sentence) {
  var words = sentence.split(" ");
  var tokens = [];
  for (var i = 0; i < words.length; i++) tokens.push({ id: String(i), text: words[i] });
  var original = words.join(" ");
  var order = tokens.slice();
  for (var n = 0; n < 20; n++) {
    order = fisher(tokens);
    var joined = [];
    for (var k = 0; k < order.length; k++) joined.push(order[k].text);
    if (joined.join(" ") !== original) return order;
  }
  return tokens.slice().reverse();
}

function startLearn(id) {
  state.view = "lesson";
  state.lessonId = Number(id);
  state.single = false;
  state.vocabOpen = false;
  render();
}

function goQuestion(i) {
  state.qIndex = i;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function goGhep() {
  var q = currentQuestion();
  state.step = 2;
  state.bank = shuffledTokens(q.example);
  state.picked = [];
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function goWrite() {
  state.step = 3;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function pickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  var i;
  for (i = 0; i < state.bank.length; i++) if (state.bank[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.bank.splice(idx, 1)[0];
  state.picked.push(tok);
  if (!state.bank.length) {
    var built = [];
    for (i = 0; i < state.picked.length; i++) built.push(state.picked[i].text);
    state.ghepChecked = true;
    state.ghepOk = built.join(" ") === currentQuestion().example;
  } else {
    state.ghepChecked = false;
    state.ghepOk = false;
  }
  render();
}

function unpickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  for (var i = 0; i < state.picked.length; i++) if (state.picked[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.picked.splice(idx, 1)[0];
  state.bank.push(tok);
  state.ghepChecked = false;
  state.ghepOk = false;
  render();
}

function rememberSentence() {
  if (state.counted) return;
  progress.sentences += 1;
  state.counted = true;
  saveProgress();
}

function checkWrite() {
  if (state.writeOk) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var result = checkAnswer(raw, currentQuestion());
  if (!result.ok) {
    state.writeMsg = result.message;
    state.writeOk = false;
    render();
    return;
  }
  rememberSentence();
  if (!state.single) {
    var lid = String(currentLesson().id);
    if (!progress.learned[lid]) progress.learned[lid] = [];
    progress.learned[lid][state.qIndex] = result.sentence;
    state.answers[state.qIndex] = result.sentence;
    if (allLearned(currentLesson())) progress.finished[lid] = true;
    saveProgress();
  }
  state.draft = result.sentence;
  state.writeMsg = "";
  state.writeOk = true;
  render();
}

function nextQuestion() {
  if (state.single) {
    returnToTest();
    return;
  }
  var lesson = currentLesson();
  if (state.qIndex >= lesson.questions.length - 1) {
    if (allLearned(lesson)) {
      progress.finished[String(lesson.id)] = true;
      saveProgress();
    }
    state.view = "lesson";
    render();
    return;
  }
  state.qIndex += 1;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function startTest(id) {
  var lesson = lessonById(id);
  var flags = masteredFlags(lesson);
  state.view = "test";
  state.lessonId = lesson.id;
  state.queue = [];
  for (var i = 0; i < lesson.questions.length; i++) if (!flags[i]) state.queue.push(i);
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.single = false;
  state.pileOk = false;
  state.pileWait = false;
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function openCard() {
  state.phase = "write";
  state.draft = "";
  state.writeMsg = "";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.counted = false;
  render();
}

function showHint() {
  if (state.phase === "result") return;
  state.hintOpen = true;
  state.hintUsed = true;
  render();
}

function moveCard(how) {
  var card = state.queue.shift();
  if (how === "end") state.queue.push(card);
  else {
    var pos = Math.min(3, state.queue.length);
    state.queue.splice(pos, 0, card);
  }
  return card;
}

function checkTest() {
  if (state.phase === "result") return;
  if (!state.queue.length) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var qIndex = state.queue[0];
  var q = currentLesson().questions[qIndex];
  var result = checkAnswer(raw, q);
  if (!normalize(raw)) {
    state.writeMsg = result.message;
    render();
    return;
  }
  state.phase = "result";
  state.writeMsg = "";
  if (result.ok && !state.hintUsed) {
    rememberSentence();
    masteredFlags(currentLesson())[qIndex] = true;
    saveProgress();
    state.queue.shift();
    state.result = { kind: "mastered", qIndex: qIndex };
    state.draft = result.sentence;
  } else if (result.ok) {
    rememberSentence();
    moveCard("end");
    state.result = { kind: "hint", qIndex: qIndex };
    state.draft = result.sentence;
  } else {
    moveCard("later");
    state.result = { kind: "wrong", qIndex: qIndex, message: result.message };
  }
  render();
}

function retryWrite() {
  if (!state.result || state.result.kind !== "wrong") return;
  var qIndex = state.result.qIndex;
  var msg = state.result.message || "";
  var i = -1;
  var k;
  for (k = 0; k < state.queue.length; k++) if (state.queue[k] === qIndex) i = k;
  if (i >= 0) state.queue.splice(i, 1);
  state.queue.unshift(qIndex);
  state.phase = "write";
  state.result = null;
  state.writeMsg = msg;
  state.hintOpen = state.hintUsed;
  render();
}

function nextCard() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.counted = false;
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function startReview() {
  var qIndex = state.result ? state.result.qIndex : state.queue[0];
  state.view = "learn";
  state.qIndex = qIndex;
  state.step = 1;
  state.single = true;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function returnToTest() {
  state.view = state.queue.length ? "test" : "celebrate";
  state.single = false;
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.pileOk = false;
  state.pileWait = false;
  render();
}

function resetTest() {
  var lesson = currentLesson();
  var fresh = [];
  for (var i = 0; i < lesson.questions.length; i++) fresh.push(false);
  progress.mastered[String(lesson.id)] = fresh;
  saveProgress();
  startTest(lesson.id);
}

function appendVocab(index) {
  var input = document.getElementById("answer-input");
  if (!input || input.disabled) return;
  var word = currentQuestion().vocab[Number(index)].en;
  var base = String(input.value).replace(/\s+$/, "");
  input.value = base ? base + " " + word : word;
  state.draft = input.value;
  state.writeMsg = "";
  var fb = document.getElementById("feedback");
  if (fb && state.view === "learn") fb.innerHTML = "";
  input.focus();
}

function setCopyStatus(msg) {
  var el = document.getElementById("copy-status");
  if (el) el.textContent = msg;
}

function copyParagraph() {
  var text = paragraphText();
  function legacy() {
    try {
      var node = document.getElementById("paragraph");
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(node);
      sel.removeAllRanges();
      sel.addRange(range);
      var done = document.execCommand("copy");
      sel.removeAllRanges();
      setCopyStatus(done ? "Đã sao chép." : "Bạn hãy chọn đoạn văn và chép tay nhé.");
    } catch (err) {
      setCopyStatus("Bạn hãy chọn đoạn văn và chép tay nhé.");
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setCopyStatus("Đã sao chép.");
      }).catch(function () { legacy(); });
      return;
    }
  } catch (err) {}
  legacy();
}

function onClick(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute("data-action");
  if (action === "welcome") { state.view = "home"; render(); return; }
  if (action === "home" || action === "topics") { state.view = "topics"; render(); return; }
  if (action === "learn") { startLearn(btn.getAttribute("data-lesson")); return; }
  if (action === "to-list") { state.view = "lesson"; render(); return; }
  if (action === "open-q") { state.view = "learn"; state.single = false; goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "show-end") { state.view = "end"; render(); return; }
  if (action === "goto-q") { goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "goto-step") {
    var gs = Number(btn.getAttribute("data-step"));
    if (gs === 1) { state.step = 1; state.vocabOpen = false; render(); }
    else if (gs === 2) goGhep();
    else goWrite();
    return;
  }
  if (action === "test") { startTest(btn.getAttribute("data-lesson")); return; }
  if (action === "to-ghep") { goGhep(); return; }
  if (action === "to-write") { goWrite(); return; }
  if (action === "pick") { pickWord(btn.getAttribute("data-id")); return; }
  if (action === "unpick") { unpickWord(btn.getAttribute("data-id")); return; }
  if (action === "check-write") { checkWrite(); return; }
  if (action === "next-q") { nextQuestion(); return; }
  if (action === "vocab") { appendVocab(btn.getAttribute("data-index")); return; }
  if (action === "rewrite") {
    progress.learned[String(state.lessonId)] = [];
    delete progress.finished[String(state.lessonId)];
    saveProgress();
    state.view = "lesson";
    render();
    return;
  }
  if (action === "copy") { copyParagraph(); return; }
  if (action === "open-card") { openCard(); return; }
  if (action === "check-test") { checkTest(); return; }
  if (action === "hint") { showHint(); return; }
  if (action === "retry") { retryWrite(); return; }
  if (action === "next-card") { nextCard(); return; }
  if (action === "review") { startReview(); return; }
  if (action === "reset-test") { resetTest(); return; }
  if (action === "review-lesson") { state.view = "lesson"; state.single = false; render(); return; }
  if (action === "toggle-vocab") { state.vocabOpen = !state.vocabOpen; render(); return; }
  if (action === "toggle-pile") {
    var pile = btn.getAttribute("data-pile");
    if (pile === "ok") state.pileOk = !state.pileOk;
    else if (pile === "wait") state.pileWait = !state.pileWait;
    render();
    return;
  }
}

function onKey(e) {
  if (e.key !== "Enter") return;
  if (!e.target || e.target.id !== "answer-input") return;
  e.preventDefault();
  if (state.view === "learn") checkWrite();
  else if (state.view === "test") checkTest();
}

function onInput(e) {
  if (!e.target || e.target.id !== "answer-input") return;
  state.draft = e.target.value;
  if (state.writeMsg && state.phase !== "result" && !state.writeOk) {
    state.writeMsg = "";
    var fb = document.getElementById("feedback");
    if (fb) fb.innerHTML = "";
  }
}

function boot() {
  progress = loadProgress();
  var app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("keydown", onKey);
  app.addEventListener("input", onInput);
  render();
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
