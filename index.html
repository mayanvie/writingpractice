<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Luyện viết tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#5C4038;--muted:#8B6F66;--line:#F3DDD8;--coral:#E07A7A;--coral-ink:#C45C5C;--coral-soft:#FDECEA;--coral-pale:#FFF6F2;--paper:#FFF6F2;--shadow:0 18px 30px -18px rgba(92,64,56,.4);--mH:clamp(150px,34dvh,300px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Nunito","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;font-weight:600;color:var(--ink);background:linear-gradient(170deg,#FDECEA,#FFF6F2 55%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscript{padding:24px;text-align:center}
.wrap{height:100%}
.scene{position:fixed;inset:0;overflow:hidden;display:flex;justify-content:center;background:linear-gradient(170deg,#FDECEA,#FFF6F2 55%)}
.scene::before,.scene::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.scene::before{width:240px;height:240px;top:-80px;right:-70px;background:rgba(244,167,167,.28)}
.scene::after{width:150px;height:150px;top:46%;left:-60px;background:rgba(125,184,146,.16)}
.col{position:relative;z-index:1;width:min(1040px,100%);height:100%;display:flex;flex-direction:column;padding:14px 22px 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.enter .content>*,.enter .bubble{animation:rise .38s ease backwards}
.enter .content>*:nth-child(2){animation-delay:.05s}.enter .content>*:nth-child(3){animation-delay:.1s}.enter .content>*:nth-child(4){animation-delay:.15s}
.char{display:block;height:var(--mH);width:auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(150,80,50,.18))}
@media (prefers-reduced-motion:reduce){.enter .content>*,.enter .bubble,.char,.stash.pop b{animation:none}}
/* header */
.head{flex:none;display:flex;align-items:center;gap:12px;min-height:48px}
.back{appearance:none;border:0;background:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted);box-shadow:0 8px 14px -8px rgba(92,64,56,.4)}
.back:hover{background:#fff}.back svg{width:20px;height:20px}
.htitle{flex:1;min-width:0;margin:0;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{flex:none;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800}
.qnums{display:flex;gap:2px}
.qn{appearance:none;border:0;background:none;width:34px;height:34px;border-radius:50%;font-weight:800;color:var(--muted)}
.qn.done{color:var(--coral-ink);background:var(--coral-pale)}
.qn.now{background:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(232,115,90,.35)}
/* stepper */
.stepper{flex:none;display:flex;align-items:center;gap:8px;padding:8px 0 12px}
.stp{appearance:none;border:0;flex:1;justify-content:center;background:#fff;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:23px;font-weight:800;color:var(--ink);box-shadow:0 8px 14px -10px rgba(92,64,56,.4)}
.stp i{width:24px;height:24px;border-radius:50%;border:0;display:grid;place-items:center;font-style:normal;font-size:.8rem;background:#FDECEA;color:#C45C5C}
.stp.done i{background:#EAF6EE;color:#3E7F5B}
.stp.now{background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 10px 16px -8px rgba(196,92,92,.6)}
.stp.now i{background:#fff;color:#C45C5C}
.sep{display:none}
/* main layout */
.main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,32%,360px);gap:28px}
.content{overflow-y:auto;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:clamp(4px,3dvh,28px)}
.char-zone{position:relative;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.bubble{position:absolute;left:0;right:0;bottom:calc(var(--mH) + 18px);background:#fff;border:0;border-radius:22px;padding:14px 16px;box-shadow:0 14px 24px -14px rgba(92,64,56,.35);font-weight:800;line-height:1.4;font-size:.98rem;max-height:calc(100% - var(--mH) + 40px);overflow:auto;z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:16px;height:16px;background:#fff;border:0;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bubble p{margin:0 0 4px}.bubble p:last-child{margin:0}.bubble .sample{color:var(--coral-ink);font-weight:800}
/* ground + dock */
.ground{position:relative;flex:none;height:auto;display:flex;align-items:center;justify-content:center;padding:8px 0 16px}
.ground::before{display:none}
.dock{position:relative;z-index:1;display:flex;gap:4px;width:min(520px,100%);justify-content:space-around;padding:8px;background:#fff;border-radius:28px;box-shadow:0 14px 24px -16px rgba(92,64,56,.45)}
.dk{appearance:none;border:0;background:none;display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;color:var(--muted)}
.dk svg{width:20px;height:20px}.dk.on{background:#FDECEA;color:#C45C5C}
/* question + frame */
.qline{display:flex;flex-direction:column;gap:2px}
.qline .ask{font-size:clamp(1.7rem,4.4vw,2.8rem);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.qline .vi{color:var(--muted);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.chip-wrap{display:flex;flex-direction:column;gap:2px}
.chip{font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800}
.chip.fixed{padding:0 2px}
.chip.blank{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;color:#C45C5C;border:2px dashed #E07A7A;border-radius:16px;background:#FDECEA}
.chip-vi{color:var(--muted);font-size:.8rem}
.example{margin:0}.ex-en{margin:0;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:22px;background:#EAF6EE;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800;color:var(--ink)}
/* ghép */
.well{width:100%;min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;border:2px dashed #E07A7A;border-radius:18px;background:#fff}
.well.good{border-style:solid;border-color:#7DB892;background:#EAF6EE}
.placeholder{color:var(--muted);font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.word{appearance:none;border:0;background:#fff;border-radius:16px;padding:9px 18px;min-height:46px;font-size:1.15rem;font-weight:800;box-shadow:0 4px 0 #F3D5D0;transition:transform .12s ease}
.word:hover{transform:translateY(-2px)}.well .word{box-shadow:0 4px 0 #F4C9C4}
/* viết */
.writeline{width:100%;display:flex;align-items:center;gap:10px;background:#FFF6F2;border-radius:22px;padding:8px 8px 8px 16px}
.answer-input{flex:1;min-width:0;border:0;background:transparent;border-radius:0;padding:10px 4px;font:inherit;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:800;color:var(--ink);outline:none}
.answer-input::placeholder{color:#C7AEA4;font-weight:700}
.answer-input.good,.answer-input:disabled.good{color:#3E7F5B;opacity:1}
.go{appearance:none;border:0;flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;display:grid;place-items:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 10px 16px -8px rgba(196,92,92,.65)}
.go:hover{transform:none}.go:disabled{background:#F3D5D0;box-shadow:none}.go svg{width:24px;height:24px}
/* buttons */
.btn-row{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.btn{appearance:none;border:0;background:linear-gradient(180deg,#E8888A,#D06868);color:#fff;border-radius:999px;min-height:58px;padding:0 26px;font-weight:800;font-size:1.05rem;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 14px 22px -10px rgba(196,92,92,.65)}
.btn:hover{transform:none}.btn:disabled{background:#F3D5D0;box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#5FA079,#3E7F5B);box-shadow:inset 0 3px 0 rgba(255,255,255,.3),0 14px 22px -10px rgba(62,127,91,.6)}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:0 8px 16px -12px rgba(92,64,56,.45)}
.linkbtn{appearance:none;border:0;background:none;color:var(--coral-ink);font-weight:800;padding:6px 2px;display:inline-flex;align-items:center;gap:8px}
.linkbtn svg{width:18px;height:18px}
.vwrap{width:100%}
.vtoggle{appearance:none;border:0;background:none;color:#C45C5C;font-weight:800;padding:6px 2px}
.vtoggle::before{content:"✦ "}.vtoggle.open::before{content:"✕ "}.vtoggle.open{background:#FDECEA;border-radius:999px;padding:6px 14px}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vchip{appearance:none;display:flex;flex-direction:column;text-align:left;gap:0;border:0;background:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 6px 12px -8px rgba(92,64,56,.4)}
button.vchip:hover{border-color:var(--coral)}.vchip-en{font-weight:800}.vchip-vi{font-size:.78rem;color:var(--muted)}
.hint-box{width:100%}.hint-note{margin:6px 0 0;color:var(--muted);font-size:.85rem}
/* piles */
.pile-row{display:flex;gap:16px;margin-top:4px}
.pile-btn{appearance:none;border:0;background:none;padding:6px 0;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.pile-btn.open{color:var(--coral-ink);border-bottom-color:var(--coral)}
.pile-list{width:100%;max-height:22dvh;overflow:auto}.mini{padding:5px 0;border-bottom:1px solid var(--line)}.pile-empty{color:var(--muted);margin:6px 0}
/* landing */
.landing .col{align-items:center;text-align:center}
.landing .lm{flex:1;min-height:0;width:min(920px,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.landing .hero{width:100%;display:flex;align-items:center;gap:28px}
.landing .bubble{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:1;max-width:none;font-size:clamp(1.35rem,3vw,2rem);padding:22px 26px;max-height:none;overflow:visible;text-align:left}
.landing .bubble::after{left:36px;bottom:-7px}
.landing .char{height:min(280px,40vh);width:auto}
.landing .ground{width:min(560px,100%);min-height:0;flex-direction:column;gap:10px;padding:0 0 8px}
.landing .btn{position:relative;z-index:1;width:100%;min-height:64px;font-size:1.2rem}
.note{position:relative;z-index:1;margin:0;font-size:.9rem;font-weight:700;color:var(--muted)}
.sheet{width:100%;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:#FFF6F2}
.sheet .btn{width:100%}
.practice .content{align-self:start;height:auto;max-height:100%;background:#fff;border-radius:34px;padding:22px 20px 18px;box-shadow:0 24px 40px -22px rgba(92,64,56,.35)}
.nobr{white-space:nowrap}
/* topics */
.tgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start;padding:8px 2px 24px}
.tile{appearance:none;border:0;text-align:left;color:var(--ink);border-radius:24px;padding:12px 14px;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 14px 22px -14px rgba(92,64,56,.35)}
.tile:hover{transform:translateY(-2px);box-shadow:0 16px 24px -12px rgba(92,64,56,.4)}
.tile:focus-visible,.qrow:focus-visible{outline:3px solid #E07A7A;outline-offset:3px}
.tone-blush{background:linear-gradient(150deg,#FDECEA,rgba(244,167,167,.7))}
.tone-mint{background:linear-gradient(150deg,#EAF6EE,rgba(125,184,146,.5))}
.ticon{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center}
.ticon svg{width:36px;height:36px;display:block}
.tfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tmeta{font-size:.95rem;font-weight:800;color:var(--ink)}
.ttitle{font-size:1.02rem;font-weight:800;line-height:1.15}
/* lesson list */
.qlist{width:100%;display:flex;flex-direction:column;gap:10px}
.qrow{appearance:none;border:0;background:#fff;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;width:100%;border-radius:22px;box-shadow:0 10px 18px -14px rgba(92,64,56,.4)}
.qrow:hover{background:#fff}
.qmark{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:#FDECEA;color:#C45C5C}
.qrow.done .qmark{background:#EAF6EE;color:#3E7F5B}
.qtext b{display:block;font-size:1.08rem;font-weight:800}.qtext small{color:var(--muted);font-size:.9rem}
.list-title{margin:0;font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}.sub{margin:0;color:var(--muted)}
.para{background:#fff;border:0;border-radius:24px;padding:16px 18px;font-size:1.2rem;line-height:1.6;box-shadow:var(--shadow)}
.copy-status{margin:0;color:var(--muted);font-size:.85rem}
.desc{margin:0;color:var(--muted)}
/* phone */
@media (max-width:760px){
  .col{padding:10px 16px 0}
  .main{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:8px;align-content:start}
  .char{height:108px}
  .bubble{position:relative;bottom:auto;max-height:none;font-size:.92rem;padding:10px 14px}
  .bubble::after{left:auto;right:18px;bottom:-7px}
  .practice .char-zone{order:-1;position:relative;width:auto;display:flex;align-items:flex-end;gap:8px}
  .practice .char{height:96px}
  .practice .bubble{position:relative;right:auto;top:auto;flex:1;width:auto;margin:0 0 4px;font-size:.92rem}
  .landing .hero{align-items:flex-end;gap:10px}
  .landing .char{height:124px}
  .landing .bubble{font-size:1.05rem;padding:14px 16px}
  .landing .bubble::after{left:28px;right:auto}
  .landing .ground{width:100%}
  .list .char-zone{order:-1;position:relative;width:auto;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
  .list .char{height:96px}
  .list .bubble{position:relative;right:auto;flex:1;margin:0 8px 12px 0}
  .ground{padding:8px 0 12px}.dk{padding:8px 12px}
  .stepper{gap:6px}.stp{height:42px;padding:0 8px;font-size:.9rem}
  .tgrid{grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:128px}
  .go{width:48px;height:48px}
  .btn{min-height:54px}
}
@media (max-width:760px) and (max-height:700px){.list .char-zone{display:none}}
.list .content{overflow-y:auto}
.col::after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:180px;border-radius:50%;background:rgba(244,167,167,.3);pointer-events:none}
.hub .col,.listx .col,.learnx .col{width:min(1180px,100%);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.hub .col::-webkit-scrollbar,.listx .col::-webkit-scrollbar,.learnx .col::-webkit-scrollbar{width:0;height:0}
.hub .col{width:min(1240px,100%);padding:20px 32px 28px}
.hub-app{min-height:100%;display:flex;align-items:flex-start;gap:36px}
.hub-main{flex:1;min-width:0}
.hub-pad{display:none}
.hub-side{position:sticky;top:0;flex:none;width:min(320px,34%);display:flex;flex-direction:column;gap:12px;max-height:calc(100dvh - 40px)}
.greet{display:flex;flex-direction:column;align-items:stretch;gap:8px;flex:1 1 auto;min-height:0}
.greet .bubble{position:relative;left:auto;right:auto;bottom:auto;flex:none;max-height:none;overflow:visible;border-radius:32px;padding:20px 22px}
.greet .bubble::after{left:46%;right:auto;bottom:-10px;width:22px;height:22px}
.greet h2{margin:4px 0 0;font-size:clamp(1.35rem,2vw,1.7rem);line-height:1.25;font-weight:800;text-wrap:balance}
.greet-k{margin:0;color:var(--muted);font-size:1rem;font-weight:700}
.greet .char{height:auto;max-height:200px;min-height:88px;width:auto;align-self:center;margin-top:auto;object-fit:contain}
.progcard{background:#fff;border-radius:26px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;box-shadow:0 20px 34px -22px rgba(92,64,56,.4);flex:none}
.progcard p{margin:0;color:var(--muted);font-size:.9rem;font-weight:700}
.progcard b{display:block;font-size:1.3rem}
.bar{width:140px;height:14px;border-radius:7px;background:#FDECEA;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(180deg,#F4A7A7,#E07A7A)}
.progcard .bar{width:min(120px,42%);height:14px;border-radius:10px}
.hub-head,.big-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:48px;margin:0 0 14px}
.hub-head h1,.big-head h2{margin:0;min-width:0;font-size:clamp(1.7rem,2.4vw,2.2rem);font-weight:800}
.big-head p{margin:0;color:var(--muted);font-size:.95rem;font-weight:700;line-height:1.4}
.test-note{margin:0 0 16px;color:var(--muted);font-size:clamp(1.25rem,1.6vw,1.5rem);font-weight:700;line-height:1.45}
.hub-tools{display:flex;align-items:center;gap:10px;flex:none}
.stash{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 4px;border-radius:999px;background:#fff;box-shadow:0 8px 14px -10px rgba(92,64,56,.45);flex:none}
.stash svg{width:26px;height:26px;display:block;flex:none}
.stash b{font-size:1rem;font-weight:800;min-width:1ch;line-height:1}
@keyframes tomato-pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.stash.pop b{animation:tomato-pop .45s ease}
.rand{appearance:none;border:0;background:none;color:#C45C5C;font-weight:800;font-size:1.05rem;padding:0}
.hub .tgrid{flex:none;min-height:0;overflow:visible;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start;padding:2px}
.hub .tile{position:relative;min-height:196px;height:auto;border-radius:28px;padding:18px 18px 16px;gap:12px;justify-content:space-between}
.hub .ticon{width:78px;height:78px}
.hub .ticon svg{width:44px;height:44px}
.hub .tbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.hub .ttitle{font-size:1.22rem;line-height:1.2;text-wrap:balance}
.hub .tsub{font-size:.9rem;font-weight:700;color:var(--muted);line-height:1.3;text-wrap:balance}
.tcheck{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#E07A7A;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem}
.big-block{margin-top:36px}
.big-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.big-btn{appearance:none;border:0;text-align:left;background:#fff;border-radius:28px;min-height:148px;padding:18px 18px 16px;box-shadow:0 16px 26px -18px rgba(92,64,56,.45);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.big-btn b{display:block;font-size:1.45rem;line-height:1.2}
.big-btn small{display:block;color:var(--muted);font-size:.95rem;font-weight:700;line-height:1.35}
.big-btn.done small{color:#2F6E4B}
.qtopic{margin:10px 0 0;color:var(--coral-ink);font-size:.85rem;font-weight:800}
.hub-foot{flex:none;display:flex;flex-direction:column;gap:8px}
.foot-row{display:flex;align-items:center;gap:10px}
.hub-foot .btn{flex:1;min-height:72px;font-size:1.4rem}
.hub-foot .note{text-align:center;margin:0;font-size:.9rem;line-height:1.35}
.listx .col{padding-bottom:22px}
.list-app{flex:none;min-height:100%;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "side main";column-gap:52px;row-gap:18px;align-items:stretch}

<noscript><p class="noscript">Bạn cần bật JavaScript để học bài này.</p></noscript>
<script>
"use strict";

/*
  THÊM BÀI MỚI
  1. Copy một object trong mảng LESSONS (đủ 5 câu).
  2. Đổi id, emoji, title, vi, tag, opener.
  3. Mỗi câu hỏi gồm: ask, vi, formula [{text, vi, blank}],
     example, exampleVi, vocab [{en, vi}], accept (RegExp),
     errors [[RegExp, "thông báo"]].
  4. Câu ví dụ phải khớp accept và không khớp errors.
  Thứ tự chấm: trống → ___ hoặc [ ] → viết hoa chữ đầu → dấu . ! ?
  → errors (khớp quy tắc đầu tiên) → accept → đúng.
  Chữ xanh = từ cố định (blank:false). Ô vàng nét đứt = chỗ trống (blank:true).
  COMING_SOON để trống khi đã đủ 10 bài. Mỗi bài là một tình huống hỏi-đáp. Bài 10 trả lời bằng I will.
*/

var UPPER = "A-ZÀÁẢÃẠĂẰẮẲẴẶÂẦẤẨẪẬĐÈÉẺẼẸÊỀẾỂỄỆÌÍỈĨỊÒÓỎÕỌÔỒỐỔỖỘƠỜỚỞỠỢÙÚỦŨỤƯỪỨỬỮỰỲÝỶỸỴ";
var LOWER = "a-zàáảãạăằắẳẵặâầấẩẫậđèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵ";
var WORD = "[" + UPPER + "][" + UPPER + LOWER + "]*";
var NUMW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty";
var TIMEW = "one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve";

function flex(phrase) {
  var out = "";
  for (var i = 0; i < phrase.length; i++) {
    var ch = phrase.charAt(i);
    if (/[A-Za-z]/.test(ch)) out += "[" + ch.toUpperCase() + ch.toLowerCase() + "]";
    else if (ch === " ") out += " ";
    else if (ch === "'") out += "'";
    else out += "\\" + ch;
  }
  return out;
}

function re(source, flags) {
  return new RegExp(source, flags || "");
}

var nameStart = "(?:" + flex("My name is") + "|" + flex("I am") + "|" + flex("I'm") + ")";
var nameAccept = re("^" + nameStart + " " + WORD + "(?: " + WORD + ")*[.!?]$");
var nameLower = re("^" + nameStart + "(?: " + WORD + ")* [" + LOWER + "]");
var placeStart = flex("I live in");
var placeAccept = re("^" + placeStart + " " + WORD + "(?: " + WORD + ")*[.!?]$");
var placeLower = re("^" + placeStart + "(?: " + WORD + ")* [" + LOWER + "]");

var LESSONS = [
  {
    id: 1,
    emoji: "💬",
    title: "Introduce Yourself",
    vi: "Trả lời khi người khác chào bạn",
    tag: "My name is / I am",
    opener: "Hello! ",
    questions: [
      {
        id: "1.1",
        ask: "What's your name?",
        vi: "Bạn tên là gì?",
        formula: [
          { text: "My name is", vi: "Tên tôi là", blank: false },
          { text: "[tên bạn]", vi: "viết hoa chữ đầu", blank: true }
        ],
        example: "My name is Lan.",
        exampleVi: "Tên tôi là Lan.",
        vocab: [
          { en: "My name is", vi: "Tên tôi là" },
          { en: "Lan", vi: "Lan" },
          { en: "Minh", vi: "Minh" },
          { en: "Hoa", vi: "Hoa" }
        ],
        accept: nameAccept,
        errors: [
          [/^My name (?:am|are)\b/i, "Sau 'My name' dùng **is**. ✅ My name is Lan."],
          [/^My name (?!is\b)\S/i, "Thiếu **is**. ✅ My name is Lan."],
          [nameLower, "Tên phải **viết hoa chữ cái đầu**: Lan, không phải lan."]
        ]
      },
      {
        id: "1.2",
        ask: "How old are you?",
        vi: "Bạn bao nhiêu tuổi?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[số]", vi: "ví dụ: 10", blank: true },
          { text: "years old", vi: "tuổi", blank: false }
        ],
        example: "I am 10 years old.",
        exampleVi: "Tôi 10 tuổi.",
        vocab: [
          { en: "I am", vi: "Tôi" },
          { en: "10", vi: "mười" },
          { en: "years old", vi: "tuổi" },
          { en: "eleven", vi: "mười một" }
        ],
        accept: re("^(?:I am|I'm) (?:\\d{1,3}|" + NUMW + ") years old[.!?]$", "i"),
        errors: [
          [/^I have\b/i, "Nói tuổi bằng **am**, không dùng have. ✅ I am 10 years old."],
          [/^I (?:is|are)\b/i, "'I' đi với **am**."],
          [/^(?:I am|I'm) years old[.!?]$/i, "Thiếu số tuổi."],
          [re("^(?:I am|I'm) (?:\\d{1,3}|" + NUMW + ") year old\\b", "i"), "Dùng **years**, vì đây là số nhiều."]
        ]
      },
      {
        id: "1.3",
        ask: "How are you?",
        vi: "Bạn khỏe không?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[cảm giác]", vi: "ví dụ: fine", blank: true }
        ],
        example: "I am fine.",
        exampleVi: "Tôi khỏe.",
        vocab: [
          { en: "I am", vi: "Tôi" },
          { en: "fine", vi: "khỏe" },
          { en: "good", vi: "tốt" },
          { en: "great", vi: "rất ổn" }
        ],
        accept: /^(?:I am|I'm) (?:fine|good|great|ok|okay)[.!?]$/i,
        errors: [
          [/^I (?:is|are)\b/i, "'I' đi với **am**. ✅ I am fine."],
          [/^I (?:fine|good|great|ok|okay)\b/i, "Thiếu **am**. ✅ I am fine."]
        ]
      },
      {
        id: "1.4",
        ask: "Are you a student?",
        vi: "Bạn là học sinh à?",
        formula: [
          { text: "I am a student", vi: "Tôi là học sinh", blank: false }
        ],
        example: "I am a student.",
        exampleVi: "Tôi là học sinh.",
        vocab: [
          { en: "I am", vi: "Tôi là" },
          { en: "a student", vi: "một học sinh" }
        ],
        accept: /^(?:I am|I'm) a student[.!?]$/i,
        errors: [
          [/^I (?:is|are)\b/i, "'I' đi với **am**."],
          [/^(?:I am|I'm) student\b/i, "Thêm **a** trước student. ✅ I am a student."]
        ]
      },
      {
        id: "1.5",
        ask: "Are you happy today?",
        vi: "Hôm nay bạn có vui không?",
        formula: [
          { text: "I am", vi: "Tôi", blank: false },
          { text: "[cảm giác]", vi: "ví dụ: happy", blank: true }
        ],
        example: "I am happy.",
        exampleVi: "Tôi vui.",
        vocab: [
          { en: "happy", vi: "vui" },
          { en: "sad", vi: "buồn" },
          { en: "tired", vi: "mệt" }
        ],
        accept: /^(?:I am|I'm) (?:happy|sad|tired)[.!?]$/i,
        errors: [
          [/^I (?:is|are)\b/i, "'I' đi với **am**. ✅ I am happy."],
          [/^I (?:happy|sad|tired)\b/i, "Thiếu **am**. ✅ I am happy."]
        ]
      }
    ]
  },
  {
    id: 2,
    emoji: "💬",
    title: "Where I Live",
    vi: "Trả lời khi người khác hỏi chỗ ở",
    tag: "I live in",
    opener: "This is where I live. ",
    questions: [
      {
        id: "2.1",
        ask: "Where do you live?",
        vi: "Bạn sống ở đâu?",
        formula: [
          { text: "I live in", vi: "Tôi sống ở", blank: false },
          { text: "[nơi]", vi: "viết hoa tên nơi", blank: true }
        ],
        example: "I live in Ha Noi.",
        exampleVi: "Tôi sống ở Hà Nội.",
        vocab: [
          { en: "I live in", vi: "Tôi sống ở" },
          { en: "Ha Noi", vi: "Hà Nội" },
          { en: "Hue", vi: "Huế" },
          { en: "Da Nang", vi: "Đà Nẵng" }
        ],
        accept: placeAccept,

function normalize(raw) {
  var s = String(raw == null ? "" : raw).replace(/[’‘‛]/g, "'").replace(/\s+/g, " ").trim();
  return s.replace(/\s+([.!?])$/, "$1");
}

function checkAnswer(raw, question) {
  var s = normalize(raw);
  if (!s) return { ok: false, message: "Hãy viết câu trả lời của bạn trước nhé." };
  if (/___|\[|\]/.test(s)) return { ok: false, message: "Hãy thay phần [ ] bằng từ của bạn." };
  if (!re("^[" + UPPER + "]").test(s)) {
    return { ok: false, message: "Chữ cái đầu câu phải **viết hoa**." };
  }
  if (!/[.!?]$/.test(s)) return { ok: false, message: "Cuối câu cần có **dấu chấm (.)**." };
  var i;
  for (i = 0; i < question.errors.length; i++) {
    if (question.errors[i][0].test(s)) return { ok: false, message: question.errors[i][1] };
  }
  if (!question.accept.test(s)) {
    return { ok: false, message: "Câu chưa đúng mẫu. Hãy nhìn lại **công thức** và ví dụ ở trên nhé." };
  }
  return { ok: true, sentence: s };
}

function loadProgress() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    var data = JSON.parse(raw);
    var p = defaultProgress();
    if (data && typeof data.sentences === "number" && isFinite(data.sentences) && data.sentences >= 0) {
      p.sentences = Math.floor(data.sentences);
    }
    if (data && data.finished && typeof data.finished === "object") p.finished = data.finished;
    if (data && data.mastered && typeof data.mastered === "object") p.mastered = data.mastered;
    if (data && data.learned && typeof data.learned === "object") p.learned = data.learned;
    return p;
  } catch (err) {
    return defaultProgress();
  }
}

function masteredFlags(lesson) {
  var id = String(lesson.id);
  var n = lesson.questions.length;

    var old = Array.isArray(arr) ? arr : [];
    arr = [];
    for (var i = 0; i < n; i++) arr.push(!!old[i]);
    progress.mastered[id] = arr;
  }
  return arr;
}

function masteredCount(lesson) {

function fisher(list) {
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function shuffledTokens(sentence) {
  var words = sentence.split(" ");
  var tokens = [];
  for (var i = 0; i < words.length; i++) tokens.push({ id: String(i), text: words[i] });
  var original = words.join(" ");
  var order = tokens.slice();
  for (var n = 0; n < 20; n++) {
    order = fisher(tokens);
    var joined = [];
    for (var k = 0; k < order.length; k++) joined.push(order[k].text);
    if (joined.join(" ") !== original) return order;
  }
  return tokens.slice().reverse();
}

function pickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  var i;
  for (i = 0; i < state.bank.length; i++) if (state.bank[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.bank.splice(idx, 1)[0];
  state.picked.push(tok);
  if (!state.bank.length) {
    var built = [];
    for (i = 0; i < state.picked.length; i++) built.push(state.picked[i].text);
    state.ghepChecked = true;
    state.ghepOk = built.join(" ") === currentQuestion().example;
  } else {
    state.ghepChecked = false;
    state.ghepOk = false;
  }
  render();
}

function unpickWord(id) {
  if (state.ghepOk) return;
  var idx = -1;
  for (var i = 0; i < state.picked.length; i++) if (state.picked[i].id === id) idx = i;
  if (idx < 0) return;
  var tok = state.picked.splice(idx, 1)[0];
  state.bank.push(tok);
  state.ghepChecked = false;
  state.ghepOk = false;
  render();
}

function rememberSentence() {
  if (state.counted) return;
  progress.sentences += 1;
  state.counted = true;
  state.tomatoPop = true;
  saveProgress();
}

function checkWrite() {
  if (state.writeOk) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var result = checkAnswer(raw, currentQuestion());
  if (!result.ok) {
    state.writeMsg = result.message;
    state.writeOk = false;
    render();
    return;
  }
  rememberSentence();
  if (!state.single) {
    var lid = String(currentLesson().id);
    if (!progress.learned[lid]) progress.learned[lid] = [];
    progress.learned[lid][state.qIndex] = result.sentence;
    state.answers[state.qIndex] = result.sentence;
    if (allLearned(currentLesson())) progress.finished[lid] = true;
    saveProgress();
  }
  state.draft = result.sentence;
  state.writeMsg = "";
  state.writeOk = true;
  render();
}

function nextQuestion() {
  if (state.single) {
    returnToTest();
    return;
  }
  var lesson = currentLesson();
  if (state.qIndex >= lesson.questions.length - 1) {
    if (allLearned(lesson)) {
      progress.finished[String(lesson.id)] = true;
      saveProgress();
    }
    state.view = "lesson";
    render();
    return;
  }
  state.qIndex += 1;
  state.step = 1;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.vocabOpen = false;
  render();
}

function mixRand(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a * 1664525 + 1013904223) >>> 0;
    return a / 4294967296;
  };
}

function seededShuffle(list, seed) {
  var a = list.slice();
  var rnd = mixRand(seed);
  var i;
  var j;
  var tmp;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(rnd() * (i + 1));
    tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function bigDeck(n) {
  var items = [];
  var i;
  for (i = 0; i < LESSONS.length; i++) items.push({ lessonId: LESSONS[i].id, qIndex: n - 1 });
  return seededShuffle(items, 4100 + n * 97);
}

function bigDone(n) {
  var deck = bigDeck(n);
  var done = 0;
  var i;
  for (i = 0; i < deck.length; i++) {
    if (masteredFlags(lessonById(deck[i].lessonId))[deck[i].qIndex]) done++;
  }
  return done;
}

function sameCard(a, b) {
  if (a && typeof a === "object") return !!b && a.lessonId === b.lessonId && a.qIndex === b.qIndex;
  return a === b;
}

function pilesDeck(deck) {
  var ok = "";
  var wait = "";
  var okN = 0;
  var waitN = 0;
  var i;
  for (i = 0; i < deck.length; i++) {
    var lesson = lessonById(deck[i].lessonId);
    var q = lesson.questions[deck[i].qIndex];
    var label = '<div class="mini"><strong>' + esc(lesson.title) + ".</strong> " + esc(q.ask) + "</div>";
    if (masteredFlags(lesson)[deck[i].qIndex]) { ok += label; okN++; }
    else { wait += label; waitN++; }
  }
  if (!okN) ok = '<p class="pile-empty">Chưa có câu nào.</p>';
  if (!waitN) wait = '<p class="pile-empty">Không còn câu nào.</p>';
  var okOpen = !!state.pileOk;
  var waitOpen = !!state.pileWait;
  var html = '<div class="pile-row">';
  html += '<button type="button" class="pile-btn ok' + (okOpen ? " open" : "") + '" data-action="toggle-pile" data-pile="ok" aria-expanded="' + (okOpen ? "true" : "false") + '">Đã thuộc · ' + okN + "</button>";
  html += '<button type="button" class="pile-btn wait' + (waitOpen ? " open" : "") + '" data-action="toggle-pile" data-pile="wait" aria-expanded="' + (waitOpen ? "true" : "false") + '">Chưa thuộc · ' + waitN + "</button>";
  html += "</div>";
  if (okOpen) html += '<div class="pile-list">' + ok + "</div>";
  if (waitOpen) html += '<div class="pile-list">' + wait + "</div>";
  return html;
}

function freshTestState() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.single = false;
  state.pileOk = false;
  state.pileWait = false;
}

function startBigTest(n) {
  var deck = bigDeck(n);
  state.bigTest = n;
  state.view = "test";
  state.queue = [];
  var i;
  for (i = 0; i < deck.length; i++) {
    var card = deck[i];
    if (!masteredFlags(lessonById(card.lessonId))[card.qIndex]) state.queue.push(card);
  }
  state.lessonId = deck[0].lessonId;
  freshTestState();
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function startTest(id) {
  var lesson = lessonById(id);
  var flags = masteredFlags(lesson);
  state.bigTest = 0;
  state.view = "test";
  state.lessonId = lesson.id;
  state.queue = [];
  for (var i = 0; i < lesson.questions.length; i++) if (!flags[i]) state.queue.push(i);
  freshTestState();
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function openCard() {
  state.phase = "write";
  state.draft = "";
  state.writeMsg = "";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.counted = false;
  render();
}

function showHint() {
  if (state.phase === "result") return;
  state.hintOpen = true;
  state.hintUsed = true;
  render();
}

function moveCard(how) {
  var card = state.queue.shift();
  if (how === "end") state.queue.push(card);
  else {
    var pos = Math.min(3, state.queue.length);
    state.queue.splice(pos, 0, card);
  }
  return card;
}

function checkTest() {
  if (state.phase === "result") return;
  if (!state.queue.length) return;
  var input = document.getElementById("answer-input");
  var raw = input ? input.value : state.draft;
  state.draft = raw;
  var card = state.queue[0];
  var big = state.bigTest > 0;
  var lesson = big ? lessonById(card.lessonId) : currentLesson();
  var qIndex = big ? card.qIndex : card;
  var q = lesson.questions[qIndex];
  var result = checkAnswer(raw, q);
  if (!normalize(raw)) {
    state.writeMsg = result.message;
    render();
    return;
  }
  state.phase = "result";
  state.writeMsg = "";
  if (result.ok && !state.hintUsed) {
    rememberSentence();
    masteredFlags(lesson)[qIndex] = true;
    saveProgress();
    state.queue.shift();
    state.result = { kind: "mastered", qIndex: qIndex, card: card };
    state.draft = result.sentence;
  } else if (result.ok) {
    rememberSentence();
    moveCard("end");
    state.result = { kind: "hint", qIndex: qIndex, card: card };
    state.draft = result.sentence;
  } else {
    moveCard("later");
    state.result = { kind: "wrong", qIndex: qIndex, card: card, message: result.message };
  }
  if (big) state.lessonId = lesson.id;
  render();
}

function retryWrite() {
  if (!state.result || state.result.kind !== "wrong") return;
  var card = state.result.card;
  var msg = state.result.message || "";
  var i = -1;
  var k;
  for (k = 0; k < state.queue.length; k++) if (sameCard(state.queue[k], card)) i = k;
  if (i >= 0) state.queue.splice(i, 1);
  state.queue.unshift(card);
  state.phase = "write";
  state.result = null;
  state.writeMsg = msg;
  state.hintOpen = state.hintUsed;
  render();
}

function nextCard() {
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.counted = false;
  if (!state.queue.length) state.view = "celebrate";
  render();
}

function startReview() {
  var card = state.result ? state.result.card : state.queue[0];
  state.view = "learn";
  if (card && typeof card === "object") {
    state.lessonId = card.lessonId;
    state.qIndex = card.qIndex;
  } else state.qIndex = card;
  state.step = 1;
  state.single = true;
  state.draft = "";
  state.writeMsg = "";
  state.writeOk = false;
  state.counted = false;
  state.ghepChecked = false;
  state.ghepOk = false;
  state.vocabOpen = false;
  render();
}

function returnToTest() {
  state.view = state.queue.length ? "test" : "celebrate";
  state.single = false;
  state.phase = "front";
  state.hintUsed = false;
  state.hintOpen = false;
  state.result = null;
  state.draft = "";
  state.writeMsg = "";
  state.pileOk = false;
  state.pileWait = false;
  render();
}

function resetTest() {
  var i;
  if (state.bigTest) {
    var deck = bigDeck(state.bigTest);
    for (i = 0; i < deck.length; i++) masteredFlags(lessonById(deck[i].lessonId))[deck[i].qIndex] = false;
    saveProgress();
    startBigTest(state.bigTest);
    return;
  }
  var lesson = currentLesson();
  var fresh = [];
  for (i = 0; i < lesson.questions.length; i++) fresh.push(false);
  progress.mastered[String(lesson.id)] = fresh;
  saveProgress();
  startTest(lesson.id);
}

function appendVocab(index) {
  var input = document.getElementById("answer-input");
  if (!input || input.disabled) return;
  var word = currentQuestion().vocab[Number(index)].en;
  var base = String(input.value).replace(/\s+$/, "");
  input.value = base ? base + " " + word : word;
  state.draft = input.value;
  state.writeMsg = "";
  var fb = document.getElementById("feedback");
  if (fb && state.view === "learn") fb.innerHTML = "";
  input.focus();
}

function setCopyStatus(msg) {
  var el = document.getElementById("copy-status");
  if (el) el.textContent = msg;
}

function copyParagraph() {
  var text = paragraphText();
  function legacy() {
    try {
      var node = document.getElementById("paragraph");
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(node);
      sel.removeAllRanges();
      sel.addRange(range);
      var done = document.execCommand("copy");
      sel.removeAllRanges();
      setCopyStatus(done ? "Đã sao chép." : "Bạn hãy chọn đoạn văn và chép tay nhé.");
    } catch (err) {
      setCopyStatus("Bạn hãy chọn đoạn văn và chép tay nhé.");
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setCopyStatus("Đã sao chép.");
      }).catch(function () { legacy(); });
      return;
    }
  } catch (err) {}
  legacy();
}

function onClick(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute("data-action");
  if (action === "continue") { startLearn(nextLesson().id); return; }
  if (action === "random") {
    var pool = [];
    var ri;
    for (ri = 0; ri < LESSONS.length; ri++) if (!allLearned(LESSONS[ri])) pool.push(LESSONS[ri]);
    if (!pool.length) pool = LESSONS;
    startLearn(pool[Math.floor(Math.random() * pool.length)].id);
    return;
  }
  if (action === "resume") {
    var lessonNow = currentLesson();
    var saved = progress.learned[String(lessonNow.id)] || [];
    var resumeAt = 0;
    for (var rq = 0; rq < lessonNow.questions.length; rq++) if (!saved[rq]) { resumeAt = rq; break; }
    state.view = "learn";
    state.single = false;
    goQuestion(resumeAt);
    return;
  }
  if (action === "retry-write") { state.writeMsg = ""; render(); return; }
  if (action === "welcome") { state.view = "home"; render(); return; }
  if (action === "home" || action === "topics") { state.view = "topics"; render(); return; }
  if (action === "learn") { startLearn(btn.getAttribute("data-lesson")); return; }
  if (action === "to-list") { state.view = "lesson"; render(); return; }
  if (action === "open-q") { state.view = "learn"; state.single = false; goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "show-end") { state.view = "end"; render(); return; }
  if (action === "goto-q") { goQuestion(Number(btn.getAttribute("data-index"))); return; }
  if (action === "goto-step") {
    var gs = Number(btn.getAttribute("data-step"));
    if (gs === 1) { state.step = 1; state.vocabOpen = false; render(); }
    else if (gs === 2) goGhep();
    else goWrite();
    return;
  }
  if (action === "test") { startTest(btn.getAttribute("data-lesson")); return; }
  if (action === "big-test") { startBigTest(Number(btn.getAttribute("data-big"))); return; }
  if (action === "to-ghep") { goGhep(); return; }
  if (action === "to-write") { goWrite(); return; }
  if (action === "pick") { pickWord(btn.getAttribute("data-id")); return; }
  if (action === "unpick") { unpickWord(btn.getAttribute("data-id")); return; }
  if (action === "check-write") { checkWrite(); return; }
  if (action === "next-q") { nextQuestion(); return; }
  if (action === "vocab") { appendVocab(btn.getAttribute("data-index")); return; }
  if (action === "rewrite") {
    progress.learned[String(state.lessonId)] = [];
    delete progress.finished[String(state.lessonId)];
    saveProgress();
    state.view = "lesson";
    render();
    return;
  }
  if (action === "copy") { copyParagraph(); return; }
  if (action === "open-card") { openCard(); return; }
  if (action === "check-test") { checkTest(); return; }
  if (action === "hint") { showHint(); return; }
  if (action === "retry") { retryWrite(); return; }
  if (action === "next-card") { nextCard(); return; }
  if (action === "review") { startReview(); return; }
  if (action === "reset-test") { resetTest(); return; }
  if (action === "review-lesson") { state.view = "lesson"; state.single = false; render(); return; }
  if (action === "toggle-vocab") { state.vocabOpen = !state.vocabOpen; render(); return; }
  if (action === "toggle-pile") {
    var pile = btn.getAttribute("data-pile");
    if (pile === "ok") state.pileOk = !state.pileOk;
    else if (pile === "wait") state.pileWait = !state.pileWait;
    render();
    return;
  }
}

function onKey(e) {
  if (e.key !== "Enter") return;
  if (!e.target || e.target.id !== "answer-input") return;
  e.preventDefault();
  if (state.view === "learn") checkWrite();
  else if (state.view === "test") checkTest();
}

function onInput(e) {
  if (!e.target || e.target.id !== "answer-input") return;
  state.draft = e.target.value;
  if (state.writeMsg && state.phase !== "result" && !state.writeOk) {
    state.writeMsg = "";
    var fb = document.getElementById("feedback");
    if (fb) fb.innerHTML = "";
  }
}

function boot() {
  progress = loadProgress();
  var app = document.getElementById("app");
  app.addEventListener("click", onClick);
  app.addEventListener("keydown", onKey);
  app.addEventListener("input", onInput);
  render();
}

if (typeof document !== "undefined") boot();
</script>
</body>
</html>
